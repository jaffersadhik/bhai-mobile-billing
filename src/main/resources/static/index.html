<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b4a">
<title>Bhai Mobile Billing | பாய் மொபைல் பில்லிங்</title>
<meta name="description" content="Bhai Mobile Billing (பாய் மொபைல் பில்லிங்): நைட்டி, சுடிதார், குர்தா, பட்டியாலா, இன்னர் மற்றும் லேடீஸ் ஐட்டங்கள். சைஸ் தேர்வு செய்து பில் WhatsApp-ல் பெறுங்கள்.">
<meta property="og:title" content="Bhai Mobile Billing">
<meta property="og:description" content="கடைகளுக்கான மொபைல் பில்லிங் · சைஸ், ரேட், WhatsApp பில்.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Mukta+Malar:wght@600;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#0e6b4a; --leaf-d:#09442f; --leaf-l:#dff0e7;
  --gold:#e9b431; --gold-l:#fbe7ac;
  --ink:#14231c; --muted:#5f6f66; --line:#dbe6df;
  --bg:#f2f7f4; --card:#fff; --wa:#1faa59; --bad:#b3261e;
  --body:'DM Sans','Noto Sans Tamil','Latha','Nirmala UI',system-ui,sans-serif;
  --head:'Mukta Malar','DM Sans','Noto Sans Tamil','Latha',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);background:#d9e6de;color:var(--ink);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(9,68,47,.18);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* ---- app bar ---- */
.bar{position:sticky;top:0;z-index:20;background:var(--leaf);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.bar .mark{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--leaf-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:24px;flex:none}
.bar .back{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);font-size:22px;font-weight:700;flex:none}
.bar h1{font-family:var(--head);font-size:20px;line-height:1.15;font-weight:800}
.bar small{display:block;font-size:11.5px;opacity:.9;font-weight:600;color:var(--gold-l)}
.find{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:19;background:var(--bg);padding:10px 16px 8px}
.find input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px 0 42px;font-size:15px}
.find span{position:absolute;left:30px;top:50%;transform:translateY(-38%);font-size:16px;pointer-events:none}
.pad{padding:6px 16px 0}

/* ---- hero ---- */
.hero{margin-top:6px;border-radius:22px;padding:22px 18px;text-align:center;color:#fff;background:linear-gradient(150deg,#0e6b4a 0%,#09442f 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:8px;border:1.5px solid rgba(233,180,49,.65);border-radius:16px;pointer-events:none}
.hero .bis{font-family:var(--head);font-size:19px;font-weight:800;color:var(--gold)}
.hero h2{font-family:var(--head);font-size:32px;font-weight:800;line-height:1.15;margin-top:6px}
.hero p{margin-top:8px;font-size:13px;font-weight:600;opacity:.9}
.hero .pill{display:inline-block;margin-top:12px;background:var(--gold);color:var(--leaf-d);font-weight:700;font-size:13px;border-radius:20px;padding:5px 14px}

.how{background:var(--leaf-l);border-radius:18px;padding:14px;margin-top:14px}
.how ol{list-style:none;display:grid;gap:8px}
.how li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.how li i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}

.h2{font-family:var(--head);font-size:19px;font-weight:800;margin:20px 0 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;background:var(--tint,#fff);border-radius:20px;padding:14px 14px 12px;min-height:138px;display:flex;flex-direction:column;border:2px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .em{font-size:40px;line-height:1.1}
.tile b{font-family:var(--head);font-size:19px;font-weight:800;margin-top:auto;line-height:1.2}
.tile small{font-size:12px;color:var(--muted);font-weight:500}
.tile .cnt{font-size:11.5px;font-weight:700;color:var(--leaf-d);margin-top:3px}
.tile .got{position:absolute;top:10px;right:10px;background:var(--leaf);color:#fff;border-radius:11px;min-width:24px;height:24px;padding:0 8px;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.tile.has{border-color:var(--leaf)}

/* ---- item cards ---- */
.group{font-family:var(--head);font-weight:800;font-size:15px;margin:16px 0 6px;color:var(--leaf-d)}
.list{display:grid;gap:12px;margin-top:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.item .top{display:flex;gap:12px;align-items:center}
.item .ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex:none;background:var(--tint,#eef)}
.item .nm b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.item .nm small{font-size:12px;color:var(--muted)}
.lbl{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{position:relative;min-width:48px;height:40px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.sz.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sz i{position:absolute;top:-7px;right:-6px;background:var(--gold);color:var(--leaf-d);font-style:normal;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.buy{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.rate b{font-family:var(--head);font-size:24px;font-weight:800;color:var(--leaf-d);line-height:1}
.rate small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.add{min-width:92px;height:40px;border-radius:12px;border:1.5px solid var(--leaf);color:var(--leaf);font-weight:700;font-size:14.5px;background:#fff}
.step{display:flex;align-items:center;height:40px;border-radius:12px;background:var(--leaf);color:#fff;flex:none}
.step button{width:38px;height:40px;font-size:21px;font-weight:700;color:#fff}
.step span{min-width:34px;text-align:center;font-size:15px;font-weight:700}
.none{padding:46px 12px;text-align:center;color:var(--muted)}
.none b{display:block;font-size:42px;margin-bottom:6px}
footer{padding:26px 16px 8px;text-align:center;font-size:12.5px;color:var(--muted)}
footer a{color:var(--leaf);font-weight:700}

/* ---- dock ---- */
.dock{position:fixed;left:50%;bottom:0;transform:translate(-50%,120%);width:min(100%,480px);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(242,247,244,0));z-index:30;transition:transform .22s}
.dock.show{transform:translate(-50%,0)}
.dock button{width:100%;height:58px;border-radius:16px;background:var(--leaf);color:#fff;display:flex;align-items:center;gap:10px;padding:0 18px;box-shadow:0 8px 22px rgba(9,68,47,.35);font-weight:700;font-size:15.5px}
.dock .n{background:var(--gold);color:var(--leaf-d);border-radius:10px;padding:2px 10px;font-size:14px;font-weight:800}
.dock .tot{font-family:var(--head);font-size:20px;font-weight:800}
.dock .go{margin-left:auto;font-size:14.5px}

/* ---- bill sheet ---- */
.veil{position:fixed;inset:0;background:rgba(10,30,22,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,480px);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:50;transform:translate(-50%,105%);transition:transform .26s ease;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{font-family:var(--head);font-size:21px;font-weight:800;padding-right:44px}
.sheet .sub{font-size:13px;color:var(--muted);margin:2px 0 6px}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:#fff;font-weight:800;font-size:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.box h3{font-size:14px;font-weight:700;margin-bottom:6px}
.bl{padding:9px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border:0}
.bl .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bl .nm{font-size:14.5px;font-weight:700;line-height:1.25}
.bl .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.bl .amt{font-family:var(--head);font-weight:800;font-size:17px;white-space:nowrap}
.bl .r2{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;font-weight:600;color:var(--muted)}
.bl .r2 b{color:var(--ink)}
.bl .step{height:34px}
.bl .step button{height:34px;width:34px}
.sum{background:var(--leaf-l);border-radius:16px;padding:14px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding:3px 0}
.sum .gt{border-top:1.5px dashed var(--leaf);margin-top:6px;padding-top:10px;font-family:var(--head);font-size:24px;font-weight:800;color:var(--leaf-d)}
.fld{display:block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:#fff}
.fld .err{display:none;color:var(--bad);font-size:12px;font-weight:600;margin-top:3px}
.fld.bad input{border-color:var(--bad)}
.fld.bad .err{display:block}
.pre{display:flex;gap:8px}
.pre b{display:grid;place-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;margin-top:4px;font-size:16px}
.pre .fldin{flex:1}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;height:54px;border-radius:15px;background:var(--wa);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.manual{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;background:#fff;border:2px dashed var(--leaf);border-radius:18px;padding:12px 14px}
.manual .pl{width:42px;height:42px;border-radius:13px;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.manual b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.manual small{font-size:12px;color:var(--muted);font-weight:500}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.qtyrow .step{height:44px}.qtyrow .step button{height:44px;width:46px}
.prev{margin-top:14px;background:var(--leaf-l);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.prev b{font-family:var(--head);font-size:22px;color:var(--leaf-d)}
.ok{text-align:center;padding-top:6px}
.ok .tick{width:68px;height:68px;border-radius:50%;background:var(--leaf-l);display:grid;place-items:center;font-size:32px;margin:0 auto 8px}
.ok pre{text-align:left;white-space:pre-wrap;word-break:break-word;font:500 12.5px/1.55 var(--body);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,24px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.22s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock{overflow:hidden}
/* ---- login ---- */
body:not(.authed) .app, body:not(.authed) .dock{display:none}
body.authed .login{display:none}
.login{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#0e6b4a 0%,#09442f 100%);color:#fff;box-shadow:0 0 40px rgba(9,68,47,.18)}
.login .brand{text-align:center;margin-bottom:22px}
.login .lmark{width:72px;height:72px;border-radius:22px;background:var(--gold);color:var(--leaf-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:40px;margin:0 auto 12px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.login .bis{font-family:var(--head);font-size:16px;font-weight:800;color:var(--gold)}
.login h1{font-family:var(--head);font-size:28px;font-weight:800;line-height:1.15;margin-top:4px}
.login .tag{font-size:13px;font-weight:600;opacity:.85;margin-top:4px}
.lcard{background:var(--bg);color:var(--ink);border-radius:22px;padding:20px 16px;box-shadow:0 14px 34px rgba(0,0,0,.25);position:relative}
.lcard::before{content:"";position:absolute;left:24px;right:24px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--gold)}
.lcard h2{font-family:var(--head);font-size:21px;font-weight:800}
.lcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
.pw{position:relative}
.pw input{padding-right:52px}
.pw .eye{position:absolute;right:4px;bottom:4px;width:44px;height:42px;border-radius:10px;font-size:18px}
.rem{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13.5px;font-weight:600}
.rem input{width:20px;height:20px;accent-color:var(--leaf)}
.lerr{display:none;margin-top:12px;background:#fdecea;color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.lerr.on{display:block}
.lcard .cta{background:var(--leaf)}
.lcard .cta:disabled{opacity:.55;cursor:not-allowed}
.lfoot{text-align:center;font-size:12px;opacity:.75;margin-top:18px}
.bar > div{flex:1;min-width:0}
.bar .out{flex:none;height:42px;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;padding:0 10px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;max-width:96px}
.bar .out span{font-size:16px}
.bar .out em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
/* ---- rate change ---- */
.item .nm{flex:1;min-width:0}
.edit{flex:none;align-self:flex-start;height:34px;padding:0 10px;border-radius:10px;background:var(--gold-l);color:var(--leaf-d);font-size:12.5px;font-weight:800;border:1.5px solid var(--gold)}
.chg{display:inline-block;margin-left:6px;background:var(--gold);color:var(--leaf-d);font-size:10.5px;font-weight:800;border-radius:8px;padding:1px 7px;vertical-align:middle}
.rate .was{font-size:11px;color:var(--muted);text-decoration:line-through;font-weight:600;margin-left:6px}
.rrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rrow .szb{height:44px;border-radius:12px;background:var(--leaf-l);color:var(--leaf-d);display:grid;place-items:center;font-weight:800;font-size:14px;text-align:center;line-height:1.1;padding:0 4px}
.rrow .fld{margin-top:0}
.rrow .fld input{margin-top:0}
.rrow .def{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px}
.rrow .def.up{color:var(--leaf)}
.rrow .def.dn{color:var(--bad)}
.bump{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.bump button{height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.admin{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;background:var(--gold-l);border:2px solid var(--gold);border-radius:18px;padding:12px 14px}
.admin .pl{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--leaf-d);display:grid;place-items:center;font-size:21px;flex:none}
.admin b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.admin small{font-size:12px;color:var(--muted);font-weight:500}
.cl{padding:10px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border:0}
.cl .r1{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cl b{font-size:14.5px}
.cl .ch{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.6}
.cl .ch s{opacity:.8}
.cl .ch strong{color:var(--leaf-d)}
.mini{height:32px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;flex:none}
.cta.leaf{background:var(--leaf)}
.cta.warn{background:#fff;color:var(--bad);border:1.5px solid #f0c9c6}
.two-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two-b .cta{margin-top:10px}
/* ---- groups & permanent items ---- */
.fld select{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:#fff;color:var(--ink);font-family:inherit}
.fld.bad select{border-color:var(--bad)}
.gtools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.gbtn{height:40px;padding:0 14px;border-radius:12px;background:var(--gold-l);border:1.5px solid var(--gold);color:var(--leaf-d);font-weight:800;font-size:13.5px}
.gbtn.plain{background:#fff;border-color:var(--line);color:var(--ink)}
.tile.addt{background:#fff;border:2px dashed var(--leaf);align-items:flex-start}
.tile.addt .em{width:46px;height:46px;border-radius:14px;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700}
.tile .new{position:absolute;top:10px;right:10px;background:var(--gold);color:var(--leaf-d);border-radius:9px;padding:1px 8px;font-size:10.5px;font-weight:800}
.tile.has .new{display:none}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.picks button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px}
.picks button.on{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf-l)}
.picks .sw{background:var(--c)}
.gprev{display:flex;align-items:center;gap:12px;margin-top:14px;border-radius:16px;padding:12px;background:var(--tint)}
.gprev .em{font-size:34px}
.gprev b{font-family:var(--head);font-size:18px;display:block;line-height:1.2}
.gprev small{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{height:38px;padding:0 12px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.chips button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.fillrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:6px}
.fillrow .fld{margin-top:0}
.fillrow button{height:48px;padding:0 14px;border-radius:12px;background:var(--leaf);color:#fff;font-weight:700;font-size:13.5px}
.hint{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}
.perm{margin-top:14px;background:var(--gold-l);border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px}
.perm .rem{margin-top:0}
.perm .fld{margin-top:8px}
/* ---- app name / company ---- */
.login .appn{font-family:var(--head);font-size:30px;font-weight:800;line-height:1.1;margin-top:6px;letter-spacing:.2px}
.login .appn span{color:var(--gold)}
.login .appta{font-size:14px;font-weight:700;opacity:.9;margin-top:2px}
.bar .appline{display:block;font-size:11px;font-weight:700;color:var(--gold-l);opacity:.95;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1.co{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .owner{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 12px}
footer .pw-by{margin-top:6px;font-size:11.5px;opacity:.85}
footer .pw-by b{color:var(--leaf)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- server version: admin panel, setup, menu ---- */
[hidden]{display:none!important}
.busy{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(242,247,244,.35);opacity:0;pointer-events:none;transition:opacity .15s}
.busy.on{opacity:1;pointer-events:auto}
.busy span{width:46px;height:46px;border-radius:50%;border:4px solid var(--leaf-l);border-top-color:var(--leaf);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.warnbox{display:flex;align-items:center;gap:10px;margin-top:12px;background:#fff4e5;border:1.5px solid #f3c27a;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;color:#7a4a00}
.warnbox button{margin-left:auto;flex:none;height:34px;padding:0 12px;border-radius:10px;background:var(--leaf);color:#fff;font-weight:700;font-size:12.5px}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 14px}
.choice:active{border-color:var(--leaf)}
.choice .em{font-size:34px;flex:none}
.choice b{display:block;font-family:var(--head);font-size:17px;font-weight:800;line-height:1.25}
.choice small{font-size:12.5px;color:var(--muted);font-weight:500}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:15px}
.mrow.warnr{color:var(--bad)}
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 8px}
.adm-head .h2{margin:0}
.acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.acard.off{opacity:.6}
.acard .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acard .r1>div{min-width:0}
.acard b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.acard small{font-size:12px;color:var(--muted);font-weight:600}
.acard .meta{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px;line-height:1.6}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{flex:none;font-size:11px;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--leaf-l);color:var(--leaf-d);white-space:nowrap}
.tag.t-admin{background:var(--gold-l);color:#7a5600}
.tag.on{background:var(--leaf);color:#fff}
.fld textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:#fff;resize:vertical;min-height:64px;font-family:inherit;color:inherit}
.bh{padding:10px 0;border-bottom:1px solid var(--line)}
.bh:last-child{border:0}
.bh .r1{display:flex;justify-content:space-between;gap:10px}
.bh .amt{font-family:var(--head);font-size:17px;color:var(--leaf-d)}
.bh .meta{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.bh .acts{margin-top:6px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:13.5px}
.dl dt{color:var(--muted);font-weight:700}
.dl dd{font-weight:600;word-break:break-word}
.cta:disabled{opacity:.6}
.ok .tick{font-size:30px}

/* ---- sales report ---- */
.rp-date{display:flex;align-items:center;gap:6px;margin-top:4px}
.rp-date input{flex:1;min-width:0;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 10px;font-size:15px;font-weight:700}
.rp-date .nav{width:44px;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:18px;font-weight:800;flex:none}
.rp-date .nav:disabled{opacity:.35}
.rp-date .chip{height:44px;padding:0 12px;border-radius:12px;background:var(--gold-l);border:1.5px solid var(--gold);color:var(--leaf-d);font-weight:800;font-size:13px;flex:none}
.rp-hero{background:linear-gradient(135deg,var(--leaf),var(--leaf-d));color:#fff;border-radius:20px;padding:16px;margin-top:12px;position:relative;overflow:hidden}
.rp-hero:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(233,180,49,.18)}
.rp-hero .l{font-size:12.5px;font-weight:700;color:var(--gold-l)}
.rp-hero .v{font-family:var(--head);font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
.rp-hero .row{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;font-weight:600;opacity:.95}
.rp-hero .row b{display:block;font-size:16px;font-family:var(--head)}
.rp-chg{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:20px;padding:3px 10px;background:rgba(255,255,255,.16)}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rp-k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.rp-k .l{font-size:11.5px;color:var(--muted);font-weight:700}
.rp-k .v{font-family:var(--head);font-size:21px;font-weight:800;color:var(--leaf-d);margin-top:2px;line-height:1.15}
.rp-k .s{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.rp-k.wide{grid-column:1/-1}
.up{color:#137a3f!important}.down{color:var(--bad)!important}
.rp-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.rp-card h3{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rp-card h3 small{font-size:11.5px;color:var(--muted);font-weight:600}
.rp-chart{width:100%;height:auto;display:block}
.rp-chart .bar{fill:var(--leaf);cursor:pointer}
.rp-chart .bar.sel{fill:var(--gold)}
.rp-chart .bar.zero{fill:var(--line)}
.rp-chart text{font-size:9px;fill:var(--muted);font-family:var(--body)}
.rp-chart .avg{stroke:var(--gold);stroke-dasharray:4 3;stroke-width:1.2}
.rp-hb{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:12.5px;font-weight:600}
.rp-hb .t{height:10px;border-radius:6px;background:var(--leaf-l);overflow:hidden}
.rp-hb .t i{display:block;height:100%;background:var(--leaf);border-radius:6px}
.rp-hb .n{white-space:nowrap;color:var(--leaf-d);font-weight:800}
.rp-hb .k{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-seg{display:inline-flex;background:var(--leaf-l);border-radius:10px;padding:3px;gap:2px}
.rp-seg button{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:8px;color:var(--leaf-d)}
.rp-seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rp-share{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.rp-share button{height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:12.5px}
.rp-share .wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.bh .lines{font-size:12px;color:var(--ink);margin-top:6px;background:var(--bg);border-radius:10px;padding:6px 8px;display:none}
.bh.open .lines{display:block}
.bh .lines div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.adm-sales{background:linear-gradient(135deg,var(--leaf),var(--leaf-d));color:#fff;border-radius:18px;padding:14px;margin-top:12px}
.adm-sales .top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm-sales .l{font-size:11.5px;color:var(--gold-l);font-weight:700}
.adm-sales .v{font-family:var(--head);font-size:24px;font-weight:800;line-height:1.15}
.adm-sales .s{font-size:11.5px;opacity:.85;font-weight:600}
.adm-sales table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
.adm-sales th{font-size:11px;color:var(--gold-l);text-align:right;font-weight:700;padding:4px 2px}
.adm-sales th:first-child,.adm-sales td:first-child{text-align:left}
.adm-sales td{padding:7px 2px;border-top:1px solid rgba(255,255,255,.14);text-align:right;font-weight:700}
.adm-sales td small{display:block;font-size:10.5px;opacity:.75;font-weight:600}
.adm-sales .go{color:var(--gold);font-weight:800;font-size:12px;text-decoration:underline;padding:0}
@media print{
  body{background:#fff}.app{box-shadow:none;max-width:none;padding:0}
  .bar,.find,.dock,footer,.rp-date,.rp-share,.acts,.rp-seg,#busy,#toast{display:none!important}
  .rp-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bh .lines{display:block}
}

/* ---- barcode scanner ---- */
.find .scbtn{position:absolute;right:22px;top:50%;transform:translateY(-38%);width:40px;height:36px;border-radius:10px;background:var(--leaf);color:#fff;font-size:17px;display:grid;place-items:center}
.find input{padding-right:58px}
.bcrow{display:grid;grid-template-columns:64px 1fr 46px;gap:8px;align-items:center;padding:0 0 8px;border-bottom:1px solid var(--line);margin-top:-4px}
.bcrow .bci{height:40px;border:1.5px dashed var(--line);border-radius:10px;padding:0 10px;font-size:14px;font-weight:600;background:#fff;width:100%;font-family:ui-monospace,Menlo,monospace}
.bcrow .bcl{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center}
.scbtn2{height:40px;border-radius:10px;background:var(--leaf-l);color:var(--leaf-d);font-size:18px;border:1.5px solid var(--leaf)}
.rrow.hasbc{border-bottom:0;padding-bottom:4px}
.bcf{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:end}
.bcf .fld input{font-family:ui-monospace,Menlo,monospace}
.bcf .scbtn2{height:48px;margin-bottom:0}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;text-align:center;letter-spacing:1px;padding:8px;word-break:break-all;color:var(--leaf-d)}
.scan{position:fixed;inset:0;z-index:90;background:#0b1410;color:#fff;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.scan.on{display:flex}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc-top b{font-family:var(--head);font-size:19px;font-weight:800}
.sc-top button{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);font-size:18px}
.sc-cam{position:relative;margin-top:10px;border-radius:18px;overflow:hidden;background:#000;flex:1;min-height:220px;max-height:46vh}
.sc-cam video{width:100%;height:100%;object-fit:cover;display:block}
.sc-frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sc-frame i{width:80%;height:42%;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);position:relative;overflow:hidden}
.sc-frame i:after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:scl 1.6s ease-in-out infinite}
@keyframes scl{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.sc-msg{position:absolute;left:12px;right:12px;bottom:12px;font-size:13px;font-weight:700;background:rgba(0,0,0,.65);border-radius:10px;padding:8px 10px;text-align:center}
.sc-msg:empty{display:none}
.sc-hint{font-size:12.5px;opacity:.8;margin-top:8px;text-align:center;font-weight:600}
.sc-last{margin-top:8px;min-height:44px;display:flex;flex-direction:column;gap:4px}
.sc-last div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700}
.sc-last div.ok{background:rgba(31,170,89,.28)}
.sc-last div.bad{background:rgba(179,38,30,.35)}
.sc-man{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.sc-man input{height:46px;border-radius:12px;border:0;padding:0 12px;font-size:16px;font-weight:700;font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.sc-man button{height:46px;padding:0 16px;border-radius:12px;background:var(--gold);color:var(--leaf-d);font-weight:800}
.sc-btns{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:8px}
.sc-btns button{height:50px;border-radius:14px;font-weight:800;font-size:15px}
.sc-btns #scTorch{width:56px;background:rgba(255,255,255,.12)}
.sc-btns #scTorch.on{background:var(--gold)}
.sc-btns #scDone{background:var(--wa);color:#fff}
.sc-btns #scTorch[hidden]+#scDone{grid-column:1/-1}

/* ---- roles / branches / stock ---- */
.tag.t-owner{background:#e7e3ff;color:#3b2a8f}
.tag.t-stock{background:#ffe7d2;color:#8a3d00}
.tag.t-sales{background:var(--leaf-l);color:var(--leaf-d)}
.brchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--leaf-l);color:var(--leaf-d);font-weight:800;font-size:13px;border-radius:20px;padding:6px 12px}
.rp-br{margin-top:8px}
.rp-br select{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 10px;font-size:15px;font-weight:700}
.rp-tbl{width:100%;border-collapse:collapse;font-size:13px}
.rp-tbl th{font-size:11px;color:var(--muted);font-weight:700;text-align:right;padding:4px 4px 6px}
.rp-tbl th:first-child,.rp-tbl td:first-child{text-align:left}
.rp-tbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-weight:700;vertical-align:top}
.rp-tbl td small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.rp-tbl tr.tap{cursor:pointer}
.rp-tbl .rp-bar{height:6px;border-radius:4px;background:var(--leaf-l);margin-top:5px;overflow:hidden}
.rp-tbl .rp-bar i{display:block;height:100%;background:var(--leaf)}
.st-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.st-sum div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.st-sum b{display:block;font-family:var(--head);font-size:20px;color:var(--leaf-d)}
.st-sum small{font-size:11px;color:var(--muted);font-weight:700}
.st-sum .neg b{color:var(--bad)}
.st-tools{display:grid;grid-template-columns:1fr 48px;gap:8px;margin-top:10px}
.st-tools input{height:46px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font-size:15px;background:#fff}
.st-tools button{height:46px;border-radius:12px;background:var(--leaf);color:#fff;font-size:18px}
.st-flt{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.st-flt button{height:34px;padding:0 12px;border-radius:17px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:800}
.st-flt button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.st-g{font-family:var(--head);font-size:16px;font-weight:800;margin:16px 0 6px}
.st-it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.st-it b{font-size:14.5px;display:block}
.st-it small{font-size:11.5px;color:var(--muted);font-weight:600}
.st-sz{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st-sz button{min-width:64px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:5px 8px;text-align:center;line-height:1.15}
.st-sz button span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.st-sz button b{font-family:var(--head);font-size:17px;color:var(--leaf-d)}
.st-sz button.neg{border-color:var(--bad);background:#fdecea}.st-sz button.neg b{color:var(--bad)}
.st-sz button.zero b{color:var(--muted)}
.st-big{font-family:var(--head);font-size:44px;font-weight:800;text-align:center;color:var(--leaf-d);line-height:1.1}
.st-big.neg{color:var(--bad)}
.st-in{display:grid;grid-template-columns:52px 1fr;gap:8px;margin-top:10px}
.st-in button{height:56px;border-radius:14px;background:var(--leaf-l);color:var(--leaf-d);font-size:22px;font-weight:800;border:1.5px solid var(--leaf)}
.st-in input{min-width:0;width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);font-size:26px;font-weight:800;text-align:center;font-family:var(--head)}
.st-q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.st-q button{height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800}
.brl{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.brl input{width:100%;height:42px;border-radius:10px;border:1.5px solid var(--line);padding:0 10px;font-size:15px;font-weight:700;min-width:0}
.brl small{grid-column:1/-1;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:-2px}
</style>
</head>
<body>
<section class="login" id="login" aria-label="Login">
  <div class="brand">
    <div class="lmark" aria-hidden="true">ப</div>
    <div class="bis" id="lBis"></div>
    <h1 class="appn" id="lApp"></h1>
    <p class="appta" id="lAppTa"></p>
    <p class="tag">கடைகளுக்கான மொபைல் பில்லிங் · Mobile Billing for shops</p>
  </div>
  <form class="lcard" id="loginForm" novalidate autocomplete="on">
    <h2>உள்நுழைவு (Login)</h2>
    <p class="sub">உங்கள் பயனர் பெயர், கடவுச்சொல்லை உள்ளிடவும்</p>
    <label class="fld">பயனர் பெயர் (Username)<input id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="fld">கடவுச்சொல் (Password)
      <div class="pw"><input id="lPass" type="password" autocomplete="current-password" required><button type="button" class="eye" id="lEye" aria-label="Show password">👁</button></div></label>
    <label class="rem"><input type="checkbox" id="lRem" checked>இந்த மொபைலில் நினைவில் வை (Stay logged in)</label>
    <div class="lerr" id="lErr" role="alert"></div>
    <button class="cta" id="lBtn" type="submit">உள்நுழை (Login)</button>
  </form>
  <p class="lfoot">பதிவு செய்த கடைகளுக்கு மட்டும் · Registered shops only</p>
</section>
<div class="app">
  <header class="bar" id="bar"></header>
  <div class="find" id="findBox"><span aria-hidden="true">🔍</span><input id="q" type="search" autocomplete="off" aria-label="Search items"><button class="scbtn" id="scanFind" aria-label="Scan barcode">📷</button></div>
  <main class="pad" id="view"></main>
  <footer>
    <p><strong id="footCo"></strong></p>
    <p id="footAddr" style="margin-top:2px"></p>
    <p id="callLine" style="margin-top:4px"></p>
    <p class="pw-by" id="footApp"></p>
  </footer>
</div>

<div class="dock" id="dock"><button id="openBill" aria-label="View bill"><span class="n" id="dockN">0</span><span class="tot" id="dockT">₹0</span><span class="go">View bill ›</span></button></div>
<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
  <button class="x" data-close aria-label="Close">✕</button>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<section class="scan" id="scan" role="dialog" aria-modal="true" aria-label="Barcode scanner">
  <div class="sc-top"><b id="scTitle">Barcode Scan</b><button id="scClose" aria-label="Close scanner">✕</button></div>
  <div class="sc-cam"><video id="scVideo" playsinline muted autoplay></video><div class="sc-frame"><i></i></div><p class="sc-msg" id="scMsg"></p></div>
  <p class="sc-hint" id="scHint"></p>
  <div class="sc-last" id="scLast"></div>
  <div class="sc-man"><input id="scCode" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Barcode எண் type / USB scanner" aria-label="Barcode number"><button id="scAdd">சேர்</button></div>
  <div class="sc-btns"><button id="scTorch" hidden aria-label="Torch">🔦</button><button id="scDone">✓ முடிந்தது</button></div>
</section>
<div class="busy" id="busy" aria-hidden="true"><span></span></div>

<script>
/* ================= EDIT HERE ================= */
const APP_NAME     = "Bhai Mobile Billing";
const APP_NAME_TA  = "பாய் மொபைல் பில்லிங்";
const BISMILLAH    = "அல்லாஹ்வின் திருப்பெயரால்";
const COUNTRY_CODE = "91";          // WhatsApp bills go to COUNTRY_CODE + customer's 10-digit mobile
const API_BASE     = "api/";        // server API inside the same WAR (users, companies, groups, items, bills are stored on the server)

/* size sets */
const SIZES = {
  alpha:  ["M","L","XL","XXL"],
  alpha5: ["S","M","L","XL","XXL"],
  alpha3: ["M","L","XL"],
  alpha4s:["S","M","L","XL"],
  chest:  ["36","38","40","42","44"],
  bra:    ["32","34","36","38","40"],
  free:   ["Free size"]
};

/* SAMPLE groups & items - copied into a new company only when it chooses "Sample groups" on first login.
   groups: id, Tamil, English, emoji, tile colour      items: [Tamil, English, size set, rate of first size, rate step per size] */
const SAMPLE_CATS = [
  ["nighty","நைட்டி","Nighty","🌙","#e3e9ff"],
  ["churidar","சுடிதார்","Churidar","👗","#ffe1ea"],
  ["kurta","குர்தா","Kurta","👚","#dff1d8"],
  ["patiala","பட்டியாலா","Patiala","👖","#fff0c9"],
  ["inner","இன்னர்","Innerwear","🩱","#f1e4f6"],
  ["leggings","லெக்கிங்ஸ்","Leggings","🩳","#ffe7d2"],
  ["dupatta","துப்பட்டா","Dupatta & Scarf","🧣","#dcefec"]
];
const SAMPLE_RAW = {
 nighty:[["காட்டன் நைட்டி","Cotton Nighty","alpha",250,10],["பிரிண்டட் நைட்டி","Printed Nighty","alpha",300,20],["ஃபேன்சி நைட்டி","Fancy Nighty","alpha",380,20],["நைட் சூட் செட்","Night Suit Set","alpha",450,30]],
 churidar:[["காட்டன் சுடிதார் செட்","Cotton Churidar Set","chest",450,20],["பிரிண்டட் சுடிதார் செட்","Printed Churidar Set","chest",550,20],["டிசைனர் சுடிதார் செட்","Designer Churidar Set","chest",850,30],["சுடிதார் பாட்டம்","Churidar Bottom","chest",150,10]],
 kurta:[["காட்டன் குர்தா","Cotton Kurta","alpha5",300,20],["பிரிண்டட் குர்தா","Printed Kurta","alpha5",350,20],["ரேயான் குர்தா","Rayon Kurta","alpha5",400,20],["லாங் குர்த்தி","Long Kurti","alpha5",450,25]],
 patiala:[["பட்டியாலா பேண்ட்","Patiala Pant","alpha",220,10],["காட்டன் பட்டியாலா செட்","Cotton Patiala Set","alpha",480,20],["பிரிண்டட் பட்டியாலா செட்","Printed Patiala Set","alpha",520,20]],
 inner:[["பிரா","Bra","bra",120,5],["பேண்டீஸ்","Panty","alpha",40,5],["பாவாடை (ஸ்லிப்)","Slip / Petticoat","alpha3",120,10],["கேமிசோல்","Camisole","alpha4s",80,5]],
 leggings:[["காட்டன் லெக்கிங்ஸ்","Cotton Leggings","alpha",180,10],["ஆங்கிள் லெங்த் லெக்கிங்ஸ்","Ankle Length Leggings","alpha",200,10],["சுடிதார் லெக்கிங்ஸ்","Churidar Leggings","alpha",190,10]],
 dupatta:[["காட்டன் துப்பட்டா","Cotton Dupatta","free",120,0],["ஷிஃபான் துப்பட்டா","Chiffon Dupatta","free",150,0],["ஸ்கார்ஃப்","Scarf","free",80,0]]
};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const inr = v => { const n=Number(v)||0; return "₹" + n.toLocaleString("en-IN",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}); };
const money = n => Math.round(n*100)/100;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseKey = k => { const i=k.lastIndexOf("|"); return [k.slice(0,i),k.slice(i+1)]; };
const newId = p => p + Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36);
const numIn = v => parseFloat(String(v==null?"":v).replace(/,/g,""));
const fmtDate = iso => { const d=new Date(iso); return isNaN(d) ? String(iso||"") : d.toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}); };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2600); }
let busyN=0;
function busy(on){ busyN=Math.max(0,busyN+(on?1:-1)); $("#busy").classList.toggle("on",busyN>0); }

/* ================= SERVER API ================= */
const TOKEN_KEY="bmb_token";
let token=null;
try{ token=localStorage.getItem(TOKEN_KEY)||sessionStorage.getItem(TOKEN_KEY); }catch(e){}
function setToken(t,remember){
  token=t||null;
  try{ localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); if(t) (remember?localStorage:sessionStorage).setItem(TOKEN_KEY,t); }catch(e){}
}
async function api(path,method,body){
  let r;
  try{
    r=await fetch(API_BASE+path,{method:method||"GET",cache:"no-store",
      headers:Object.assign({"Content-Type":"application/json"},token?{"X-Auth":token}:{}),
      body:body===undefined?undefined:JSON.stringify(body)});
  }catch(e){ const er=new Error("Server-ஐ அணுக முடியவில்லை. Internet / server-ஐ சரி பார்க்கவும்"); er.status=0; throw er; }
  let data=null; try{ data=await r.json(); }catch(e){}
  if(r.status===401 && path!=="login") sessionExpired((data&&data.error)||"");
  if(!r.ok){ const er=new Error((data&&data.error)||("Server error "+r.status)); er.status=r.status; throw er; }
  return data||{};
}
function apiErr(e){ if(e && e.status!==401) toast(e.message||"Error"); }

/* ================= STATE ================= */
let me=null, company=null, defaultPw=false, adminData=null;
let catalog={version:0,setup:false,cats:[],items:[]};
let CATS=[], ITEMS=[], byId={}, catById={}, byCode={};
let cart={}, sel={}, customs={};
let customQty=1, customFrom="home", customCat=null, cameFromHome=false;

const isAdmin = () => !!(me && me.type==="admin");
const isOwner = () => !!(me && me.type==="owner");   // reports only
const isStock = () => !!(me && me.type==="stock");   // sales + stock
const canEdit = () => !!(me && company && !isOwner());     // admin (inside an opened company), sales and stock users manage groups / items
const canStock = () => !!(me && company && (isAdmin()||isStock()));
const TYPE_LABEL = {admin:"⚙ Admin", owner:"👑 Owner", sales:"🧾 Sales", stock:"📦 Stock"};
let myBranch="";

function buildCatalog(){
  CATS=(catalog.cats||[]).map(c=>[c.id,c.ta,c.en||"",c.emoji||"🛍️",c.color||"#e8eef0"]);
  catById={}; CATS.forEach(c=>catById[c[0]]=c);
  ITEMS=[]; byId={}; byCode={};
  CATS.forEach(c=>(catalog.items||[]).filter(x=>x.cat===c[0]).forEach(x=>{
    const it={id:x.id,cat:x.cat,ta:x.ta,en:x.en||"",emoji:c[3],sizes:x.sizes.map(z=>({size:z.size,rate:Number(z.rate),code:z.code||""}))};
    ITEMS.push(it); byId[it.id]=it;
    it.sizes.forEach(z=>{ if(z.code) byCode[z.code]={id:it.id,size:z.size}; });
  }));
}
function sampleCatalog(){
  const cats=SAMPLE_CATS.map(c=>({id:c[0],ta:c[1],en:c[2],emoji:c[3],color:c[4]})), items=[];
  SAMPLE_CATS.forEach(c=>(SAMPLE_RAW[c[0]]||[]).forEach(r=>items.push({
    id:"s_"+c[0]+"_"+r[1].toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""), cat:c[0], ta:r[0], en:r[1],
    sizes:SIZES[r[2]].map((sz,i)=>({size:sz,rate:r[3]+r[4]*i}))})));
  return {cats,items};
}
async function loadData(){ const r=await api("data"); company=r.company; catalog=r.catalog; buildCatalog(); }

/* cart is kept on this phone, separately for every company */
const ck = n => "bmb_"+n+"_"+(company?company.id:"x");
function loadCart(){
  cart={}; customs={}; sel={};
  try{ const s=JSON.parse(localStorage.getItem(ck("cart"))||"{}"); for(const k in s){ const [id,size]=parseKey(k); if(byId[id]&&byId[id].sizes.some(z=>z.size===size)&&s[k]>0) cart[k]=Math.min(99,s[k]|0); } }catch(e){}
  try{ const c=JSON.parse(localStorage.getItem(ck("custom"))||"{}"); for(const id in c){ const v=c[id]; if(v&&v.name&&v.rate>0&&v.qty>0) customs[id]={name:String(v.name),size:String(v.size||""),rate:Number(v.rate),qty:Math.min(99,v.qty|0),code:String(v.code||"")}; } }catch(e){}
}
function save(){ if(!company) return; try{ localStorage.setItem(ck("cart"),JSON.stringify(cart)); localStorage.setItem(ck("custom"),JSON.stringify(customs)); }catch(e){} }
function purgeCart(){ for(const k in cart){ const [id,size]=parseKey(k); if(!byId[id]||!byId[id].sizes.some(z=>z.size===size)) delete cart[k]; } save(); }

/* every change to groups/items is saved on the server (with a version check, so two phones can't overwrite each other) */
let catBusy=false;
async function commitCatalog(mutate,okMsg){
  if(catBusy){ toast("சேமிக்கப்படுகிறது, காத்திருக்கவும்…"); return false; }
  const draft=JSON.parse(JSON.stringify({cats:catalog.cats||[],items:catalog.items||[]}));
  if(mutate(draft)===false){ toast("தரவு மாறியுள்ளது. மீண்டும் முயற்சிக்கவும்"); return false; }
  catBusy=true; busy(true);
  try{
    const r=await api("catalog","PUT",{version:catalog.version,cats:draft.cats,items:draft.items});
    catalog=r.catalog; buildCatalog(); purgeCart();
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){
    if(e.status===409){ toast("வேறு மொபைலில் மாற்றம் நடந்தது — புதிய தரவு ஏற்றப்பட்டது. மீண்டும் முயற்சிக்கவும்"); try{ await loadData(); purgeCart(); }catch(x){} closeSheet(); renderAll(); }
    else apiErr(e);
    return false;
  }finally{ catBusy=false; busy(false); }
}

/* ================= CART HELPERS ================= */
const rateOf = (id,size) => byId[id].sizes.find(z=>z.size===size).rate;
const selSize = id => (byId[id].sizes.some(z=>z.size===sel[id]) ? sel[id] : byId[id].sizes[0].size);
const lines = () => {
  const cat = Object.keys(cart).filter(k=>{ const [id,size]=parseKey(k); return byId[id]&&byId[id].sizes.some(z=>z.size===size); })
    .map(k=>{ const [id,size]=parseKey(k); const it=byId[id], rate=rateOf(id,size); return {k,it,size,rate,qty:cart[k],amt:money(rate*cart[k])}; })
    .sort((a,b)=>ITEMS.indexOf(a.it)-ITEMS.indexOf(b.it));
  const cus = Object.keys(customs).map(id=>{ const c=customs[id]; return {k:"c:"+id,it:{ta:c.name,en:"",custom:true},size:c.size,rate:c.rate,qty:c.qty,amt:money(c.rate*c.qty)}; });
  return cat.concat(cus);
};
const pieces = () => lines().reduce((a,l)=>a+l.qty,0);
const grand  = () => money(lines().reduce((a,l)=>a+l.amt,0));

/* ================= VIEWS ================= */
function view(){
  if(!me) return "none";
  const h=location.hash.slice(1);
  if(h==="admin" && isAdmin()) return "admin";
  if(!company) return isAdmin() ? "admin" : "nocompany";
  if(isOwner() || h==="report") return "report";
  if(!catalog.setup) return "setup";
  if(h==="stock" && canStock()) return "stock";
  if(catById[h]) return "cat";
  return "home";
}
const curCat = () => view()==="cat" ? catById[location.hash.slice(1)] : null;
function coMark(){
  const n=String(company?company.name:"ப").trim()||"ப";
  try{ if(window.Intl&&Intl.Segmenter){ const f=new Intl.Segmenter("ta",{granularity:"grapheme"}).segment(n)[Symbol.iterator]().next().value; if(f) return f.segment; } }catch(e){}
  return Array.from(n)[0];
}
function renderBrand(){
  document.title = company ? `${company.name} | ${APP_NAME}` : `${APP_NAME} | ${APP_NAME_TA}`;
  $("#footCo").textContent = company ? company.name : APP_NAME;
  $("#footAddr").textContent = company ? [company.address,company.city].filter(Boolean).join(", ") : "";
  const ph = company && company.phone;
  $("#callLine").innerHTML = ph ? `அழைக்க: <a href="tel:+${COUNTRY_CODE}${esc(ph)}">${esc(ph)}</a>` : "";
  $("#footApp").innerHTML = company ? `Powered by <b>${esc(APP_NAME)}</b>` : "";
}
function renderBar(){
  const v=view(), c=curCat();
  let left;
  if(c) left=`<button class="back" id="back" aria-label="Back">←</button><div><h1>${esc(c[1])}</h1><small>${esc(c[2])}</small></div>`;
  else if(v==="admin") left=`${company?`<button class="back" id="toHome" aria-label="Back to billing">←</button>`:`<div class="mark" aria-hidden="true">⚙</div>`}<div><span class="appline">${esc(APP_NAME)}</span><h1 class="co">Admin Panel</h1></div>`;
  else if(v==="report") left=`${isOwner()?`<div class="mark" aria-hidden="true">📊</div>`:`<button class="back" id="toHome" aria-label="Back">←</button>`}<div><span class="appline">${esc(company.name)}${myBranch?" · "+esc(myBranch):""}</span><h1 class="co">விற்பனை அறிக்கை</h1></div>`;
  else if(v==="stock") left=`<button class="back" id="toHome" aria-label="Back">←</button><div><span class="appline">${esc(company.name)}</span><h1 class="co">📦 ஸ்டாக் (Stock)</h1></div>`;
  else left=`<div class="mark" aria-hidden="true">${esc(coMark())}</div><div><span class="appline">${esc(APP_NAME)}</span><h1 class="co">${esc(company?company.name:APP_NAME)}</h1></div>`;
  $("#bar").innerHTML = left + (me?`<button class="out" id="menuBtn" aria-label="Menu"><span aria-hidden="true">☰</span><em>${esc(me.user)}</em></button>`:"");
  $("#findBox").hidden = !(v==="home"||v==="cat");
  $("#q").placeholder = c ? `${c[1]} பகுதியில் தேடு` : "எல்லா ஐட்டங்களிலும் தேடு (Search)";
}
function heroHtml(){
  return `<section class="hero">${company.bismillah!==false?`<div class="bis">${esc(BISMILLAH)}</div>`:""}<h2>${esc(company.name)}</h2>
    ${company.tagline?`<p>${esc(company.tagline)}</p>`:""}<span class="pill">${esc(APP_NAME)}</span><br>
    <span class="owner">👤 ${esc(me.name)} · ${esc(me.user)}${isAdmin()?" · Admin":""}${myBranch?" · 🏬 "+esc(myBranch):""}</span></section>`;
}
const pwWarn = () => defaultPw ? `<div class="warnbox">⚠️ Default password பயன்படுத்துகிறீர்கள். உடனே மாற்றவும்<button id="chgPw">மாற்று</button></div>` : "";
function ctl(id){
  const q=cart[id+"|"+selSize(id)];
  return q ? `<div class="step"><button data-act="dec" aria-label="Decrease">−</button><span>${q}</span><button data-act="inc" aria-label="Increase">+</button></div>`
           : `<button class="add" data-act="inc">ADD</button>`;
}
function card(it){
  const s=selSize(it.id);
  return `<article class="item" data-item="${esc(it.id)}" style="--tint:${catById[it.cat][4]}">
    <div class="top"><span class="ico" aria-hidden="true">${esc(it.emoji)}</span><div class="nm"><b>${esc(it.ta)}</b><small>${esc(it.en)}</small></div>${canEdit()?`<button class="edit" data-edit="${esc(it.id)}" aria-label="Edit ${esc(it.ta)}">✏️ மாற்று</button>`:""}</div>
    <div class="lbl">சைஸ் (Size)</div>
    <div class="sizes" role="group" aria-label="Size">${it.sizes.map(z=>{ const q=cart[it.id+"|"+z.size];
      return `<button class="sz ${z.size===s?'on':''}" data-size="${esc(z.size)}" aria-pressed="${z.size===s}">${esc(z.size)}${q?`<i>${q}</i>`:""}</button>`;}).join("")}</div>
    <div class="buy"><div class="rate"><b>${inr(rateOf(it.id,s))}</b><small>ஒரு துண்டு (per piece)</small></div><div>${ctl(it.id)}</div></div>
  </article>`;
}
function manualBtn(sub,prefill){
  return `<button class="manual" data-custom data-prefill="${esc(prefill||"")}"><span class="pl" aria-hidden="true">+</span><div><b>Custom ஐட்டம் சேர்க்க</b><small>${sub}</small></div></button>`;
}
function renderView(){
  const v=view(), q=$("#q").value.trim().toLowerCase();
  const match = it => !q || (it.ta+" "+it.en).toLowerCase().includes(q);
  const empty = `<div class="none"><b>🔎</b>ஐட்டம் கிடைக்கவில்லை<br>No item found</div>`;
  let html="";
  if(v==="none") html="";
  else if(v==="admin") html=renderAdmin();
  else if(v==="report") html=renderReport();
  else if(v==="stock") html=renderStock();
  else if(v==="nocompany") html=`<div class="none"><b>🏬</b>உங்கள் கணக்கில் கம்பெனி இணைக்கப்படவில்லை.<br>Admin-ஐ தொடர்பு கொள்ளவும்.</div>`;
  else if(v==="setup"){
    html = heroHtml()+pwWarn()+`<h2 class="h2">தொடங்குவோம் 👋</h2>
      <p class="hint" style="font-size:13.5px">உங்கள் கடைக்கு இன்னும் குரூப் / ஐட்டம் எதுவும் இல்லை. எப்படி தொடங்க வேண்டும்?</p>
      <button class="choice" id="setupSample"><span class="em" aria-hidden="true">📋</span><div><b>Sample குரூப்புகளுடன் தொடங்கு</b><small>நைட்டி, சுடிதார், குர்தா, பட்டியாலா, இன்னர், லெக்கிங்ஸ், துப்பட்டா — ${Object.values(SAMPLE_RAW).reduce((a,l)=>a+l.length,0)} ஐட்டங்கள். பிறகு பெயர், ரேட் மாற்றலாம்</small></div></button>
      <button class="choice" id="setupEmpty"><span class="em" aria-hidden="true">✨</span><div><b>புதிதாக தொடங்கு</b><small>உங்கள் சொந்த குரூப், ஐட்டங்களை நீங்களே உருவாக்கலாம்</small></div></button>`;
  }
  else if(v==="cat"){
    const c=curCat(), list=ITEMS.filter(it=>it.cat===c[0] && match(it)), none=!q && !ITEMS.some(it=>it.cat===c[0]);
    const tools = canEdit() ? `<div class="gtools"><button class="gbtn" data-additem="${esc(c[0])}">➕ புது ஐட்டம் (Add item)</button><button class="gbtn plain" data-editgroup="${esc(c[0])}">✏️ குரூப் மாற்று</button></div>` : "";
    html = tools + (list.length ? `<div class="list">${list.map(card).join("")}</div>`

function change(key,dir){

    const id=key.slice(2), c=customs[id]; if(!c) return;
    const n=c.qty+dir; if(n<=0) delete customs[id]; else c.qty=Math.min(n,99);

  out.push("",`பில் எண்: ${b.no}`,fmtDate(b.at));

function togglePerm(){ const on=$("#cPerm").checked; $("#fCCat").hidden=!on; $("#cPermHint").hidden=!on; }
async function submitCustom(){
  const name=$("#cName").value.trim(), size=$("#cSize").value.trim(), rate=money(numIn($("#cRate").value));
  const okN=name.length>0, okR=isFinite(rate)&&rate>0&&rate<=999999;
  $("#fCName").classList.toggle("bad",!okN); $("#fCRate").classList.toggle("bad",!okR);
  if(!okN||!okR){ toast("பெயர் மற்றும் ரேட்டை சரி பார்க்கவும்"); return; }
  const code=cleanCode($("#cCode").value);
  if(code && byCode[code]){ $("#fCCode").classList.add("bad"); const h=byCode[code]; toast("இந்த barcode ஏற்கனவே "+byId[h.id].ta+" ("+h.size+")-க்கு உள்ளது"); return; }
  if(canEdit() && $("#cPerm") && $("#cPerm").checked){
    const cat=$("#cCat").value; if(!catById[cat]){ toast("குரூப்பை தேர்வு செய்யவும் / உருவாக்கவும்"); return; }
    const sz=(size||"Free size").replace(/\|/g,"/").slice(0,12);
    const ex=(catalog.items||[]).find(i=>i.cat===cat && i.ta.toLowerCase()===name.toLowerCase());
    const id=ex?ex.id:newId("u"), qty=customQty, from=customFrom;
    const ok=await commitCatalog(d=>{
      const x=d.items.find(i=>i.id===id);
      const nz=code?{size:sz,rate,code}:{size:sz,rate};
      if(x){ const z=x.sizes.find(z=>z.size===sz); if(z){ z.rate=rate; if(code) z.code=code; } else x.sizes.push(nz); }
      else d.items.push({id,cat,ta:name.slice(0,60),en:"",sizes:[nz]});
    });
    if(!ok) return;
    const k=id+"|"+sz; if(byId[id]&&byId[id].sizes.some(z=>z.size===sz)){ cart[k]=Math.min(99,(cart[k]||0)+qty); save(); }
    renderAll(); toast("நிரந்தரமாக சேமிக்கப்பட்டது: "+catById[cat][1]+" › "+name);
    if(from==="bill") openBill(); else closeSheet();
    return;
  }
  let id=Object.keys(customs).find(i=>{ const c=customs[i]; return c.name.toLowerCase()===name.toLowerCase() && c.size.toLowerCase()===size.toLowerCase() && c.rate===rate; });
  if(id){ customs[id].qty=Math.min(99,customs[id].qty+customQty); if(code) customs[id].code=code; }
  else { id="x"+Date.now().toString(36)+Math.floor(Math.random()*1000); customs[id]={name,size,rate,qty:customQty,code}; }
  save(); renderDock(); toast("சேர்க்கப்பட்டது: "+name);
  if(customFrom==="bill") openBill(); else closeSheet();
}

const parseSizes = t => [...new Set(String(t||"").split(/[,\n]+/).map(x=>x.trim().replace(/\|/g,"/").slice(0,12)).filter(Boolean))].slice(0,20);

      <div class="fld">நிறம் (Colour)<div class="picks">${TINTS.map(c=>`<button type="button" class="sw ${c===gForm.color?"on":""}" data-gcolor="${c}" style="--c:${c}" aria-label="Colour ${c}"></button>`).join("")}</div></div>

function groupPreview(){
  const el=$("#gPrev"); if(!el) return;
  el.style.setProperty("--tint",gForm.color);
  el.innerHTML=`<span class="em" aria-hidden="true">${gForm.emoji}</span><div><b>${esc($("#gTa").value.trim()||"குரூப் பெயர்")}</b><small>${esc($("#gEn").value.trim()||"Preview")}</small></div>`;
}
async function saveGroup(){
  const ta=$("#gTa").value.trim(), en=$("#gEn").value.trim();
  $("#fGTa").classList.toggle("bad",!ta); if(!ta){ toast("குரூப் பெயரை உள்ளிடவும்"); return; }
  if(CATS.find(c=>c[0]!==gForm.id && c[1].toLowerCase()===ta.toLowerCase())){ $("#fGTa").classList.add("bad"); toast("இந்த பெயரில் ஏற்கனவே குரூப் உள்ளது"); return; }
  const f=gForm, isNew=!f.id, id=f.id||newId("g");
  const ok=await commitCatalog(d=>{
    if(isNew){ d.cats.push({id,ta,en,emoji:f.emoji,color:f.color}); return; }
    const c=d.cats.find(x=>x.id===id); if(!c) return false; Object.assign(c,{ta,en,emoji:f.emoji,color:f.color});
  },(isNew?"புது குரூப்: ":"குரூப் மாற்றப்பட்டது: ")+ta);
  if(!ok) return;
  const ret=f.ret; gForm=null;
  if(ret && ret.type==="item"){ renderAll(); openItemForm(id,ret.draft); return; }
  if(ret && ret.type==="custom"){ renderAll(); customCat=id; openCustom(ret.from,"",{draft:ret.draft}); return; }
  closeSheet();
  if(location.hash.slice(1)===id) renderAll(); else { cameFromHome=true; $("#q").value=""; location.hash=id; }
}
async function deleteGroup(){
  const id=gForm.id, g=(catalog.cats||[]).find(c=>c.id===id), n=(catalog.items||[]).filter(i=>i.cat===id).length;
  if(!g) return;
  if(!confirm(`"${g.ta}" குரூப்${n?` மற்றும் அதில் உள்ள ${n} ஐட்டங்கள்`:""} நிரந்தரமாக நீக்கப்படும். உறுதியா?`)) return;
  const ok=await commitCatalog(d=>{ d.cats=d.cats.filter(c=>c.id!==id); d.items=d.items.filter(i=>i.cat!==id); },"குரூப் நீக்கப்பட்டது: "+g.ta);
  if(!ok) return;
  gForm=null; closeSheet();
  if(location.hash) location.hash=""; else renderAll();
}

  $("#sheetBody").innerHTML=`
    <h2>புது ஐட்டம் சேர்க்க</h2><p class="sub">எந்த குரூப்பிலும் நிரந்தர ஐட்டம் · சைஸ் வாரியாக ரேட்</p>
    <div class="box frm">
      <label class="fld">குரூப் (Group)<select id="iCat">${catOptions(iForm.cat,true)}</select></label>
      <label class="fld" id="fITa">ஐட்டம் பெயர் (தமிழ்)<input id="iTa" maxlength="60" autocomplete="off" placeholder="எ.கா. காட்டன் சேலை"><span class="err">ஐட்டம் பெயரை உள்ளிடவும்</span></label>

      <label class="fld" id="fISizes" ${iForm.set==="custom"?"":"hidden"}>சைஸ்களை comma போட்டு எழுதவும்<input id="iSizes" maxlength="200" autocomplete="off" placeholder="எ.கா. 28, 30, 32  அல்லது  2-3Y, 4-5Y"><span class="err">குறைந்தது ஒரு சைஸ் தேவை</span></label>
    </div>
    <div class="box"><h3>ரேட் (ஒரு துண்டுக்கு)</h3>
      <div class="fillrow"><label class="fld">முதல் சைஸ் ரேட் ₹<input id="iBase" inputmode="decimal" autocomplete="off" placeholder="350"></label>
        <label class="fld">ஒவ்வொரு சைஸுக்கும் கூடுதல் ₹<input id="iStep" inputmode="decimal" autocomplete="off" placeholder="0"></label>
        <button type="button" id="itemFill">நிரப்பு</button></div>
      <p class="hint">எ.கா. 350 + 20 → M ₹350, L ₹370, XL ₹390… (தனியாகவும் மாற்றலாம்)</p>
      <div id="iRows" style="margin-top:6px"></div>
    </div>
    <button class="cta leaf" id="itemSave">ஐட்டத்தை சேமி (Save)</button>
    <button class="cta ghost" id="itemCancel">ரத்து (Cancel)</button>`;
  if(draft){ $("#iTa").value=draft.ta||""; $("#iEn").value=draft.en||""; $("#iSizes").value=draft.sizes||""; }

const curISizes = () => iForm.set==="custom" ? parseSizes($("#iSizes").value) : SIZES[iForm.set].slice();
function keepIVals(){ document.querySelectorAll("[data-isz]").forEach(i=>{ iForm.vals[i.dataset.isz]=i.value; }); iForm.codes=iForm.codes||{}; document.querySelectorAll("[data-icode]").forEach(i=>{ iForm.codes[i.dataset.icode]=i.value; }); }
function renderIRows(){
  const list=curISizes();
  $("#iRows").innerHTML = list.length ? list.map((sz,i)=>`<div class="rrow"><span class="szb">${esc(sz)}</span>
      <label class="fld" id="if${i}"><input data-isz="${esc(sz)}" data-iri="${i}" inputmode="decimal" autocomplete="off" placeholder="₹" aria-label="Rate for size ${esc(sz)}"><span class="err">சரியான ரேட்</span></label></div>`).join("")
    : `<p class="hint">மேலே சைஸ்களை எழுதவும்</p>`;
  if(list.length) $("#iRows").innerHTML = list.map((sz,i)=>`<div class="rrow hasbc"><span class="szb">${esc(sz)}</span>
      <label class="fld" id="if${i}"><input data-isz="${esc(sz)}" data-iri="${i}" inputmode="decimal" autocomplete="off" placeholder="₹" aria-label="Rate for size ${esc(sz)}"><span class="err">சரியான ரேட்</span></label></div>
    <div class="bcrow"><span class="bcl">Barcode</span><input class="bci" id="ic${i}" data-icode="${esc(sz)}" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="optional" aria-label="Barcode for size ${esc(sz)}"><button type="button" class="scbtn2" data-scanfill="ic${i}" aria-label="Scan barcode for size ${esc(sz)}">📷</button></div>`).join("");
  iForm.codes=iForm.codes||{};
  document.querySelectorAll("[data-isz]").forEach(i=>{ const v=iForm.vals[i.dataset.isz]; if(v!==undefined) i.value=v; });
  document.querySelectorAll("[data-icode]").forEach(i=>{ const v=iForm.codes[i.dataset.icode]; if(v!==undefined) i.value=v; });
}
function itemDraft(){ keepIVals(); return {ta:$("#iTa").value, en:$("#iEn").value, set:iForm.set, sizes:$("#iSizes").value, vals:iForm.vals, codes:iForm.codes}; }
async function saveItem(){
  const cat=$("#iCat").value, ta=$("#iTa").value.trim(), en=$("#iEn").value.trim(), list=curISizes();
  $("#fITa").classList.toggle("bad",!ta);
  if(iForm.set==="custom") $("#fISizes").classList.toggle("bad",!list.length);
  let ok=!!ta && list.length>0 && !!catById[cat]; const sizes=[];
  document.querySelectorAll("[data-isz]").forEach((inp,i)=>{
    const v=money(numIn(inp.value)), good=isFinite(v)&&v>0&&v<=999999;
    $("#if"+i).classList.toggle("bad",!good); if(!good) ok=false; else { const code=cleanCode(($("#ic"+i)||{}).value); sizes.push(code?{size:inp.dataset.isz,rate:v,code}:{size:inp.dataset.isz,rate:v}); }
  });
  if(!ok){ toast("பெயர், சைஸ், ரேட்டை சரி பார்க்கவும்"); return; }
  const clash=codeClash(sizes,null); if(clash){ toast(clash); return; }
  if(ITEMS.some(it=>it.cat===cat && it.ta.toLowerCase()===ta.toLowerCase())){ $("#fITa").classList.add("bad"); toast("இந்த குரூப்பில் இதே பெயரில் ஐட்டம் உள்ளது"); return; }
  const done=await commitCatalog(d=>{ d.items.push({id:newId("u"),cat,ta,en,sizes}); },"புது ஐட்டம் சேர்க்கப்பட்டது: "+ta);
  if(!done) return;
  closeSheet(); iForm=null;
  if(location.hash.slice(1)===cat) renderAll(); else { cameFromHome=true; $("#q").value=""; location.hash=cat; }
}

function itemHint(i){
  const it=byId[editItem]; if(!it) return; const z=it.sizes[i], v=numIn($("#r"+i).value), el=$("#rd"+i);
  if(!isFinite(v)||v<=0){ el.className="def"; el.textContent=`இப்போது: ${inr(z.rate)}`; return; }
  const d=money(v-z.rate);
  el.className="def"+(d>0?" up":d<0?" dn":"");
  el.textContent = d===0 ? `இப்போது: ${inr(z.rate)}` : `இப்போது ${inr(z.rate)} · ${d>0?"+":"−"}${inr(Math.abs(d))}`;
}
function openItemEdit(id){
  const it=byId[id]; if(!it) return; editItem=id;
  $("#sheetBody").innerHTML=`
    <h2>ஐட்டம் மாற்றம்</h2><p class="sub">பெயர், குரூப், ரேட், barcode மாற்றலாம் · எல்லா மொபைலிலும் உடனே மாறும்</p>
    <div class="box frm"><label class="fld" id="fETa">ஐட்டம் பெயர் (தமிழ்)<input id="eTa" maxlength="60" autocomplete="off"><span class="err">பெயரை உள்ளிடவும்</span></label>
      <label class="fld">English பெயர் (optional)<input id="eEn" maxlength="60" autocomplete="off"></label>
      <label class="fld">குரூப் (Group)<select id="eCat">${catOptions(it.cat,false)}</select></label></div>
    <div class="box"><h3>ரேட் (Rate)</h3>${it.sizes.map((z,i)=>`
      <div class="rrow hasbc"><span class="szb">${esc(z.size)}</span>
        <label class="fld" id="rf${i}"><input id="r${i}" data-ri="${i}" inputmode="decimal" autocomplete="off" value="${z.rate}" aria-label="Rate for size ${esc(z.size)}">
          <span class="def" id="rd${i}"></span><span class="err">சரியான ரேட்டை உள்ளிடவும்</span></label></div>
      <div class="bcrow"><span class="bcl">Barcode</span><input class="bci" id="bc${i}" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="optional" value="${esc(z.code||"")}" aria-label="Barcode for size ${esc(z.size)}"><button type="button" class="scbtn2" data-scanfill="bc${i}" aria-label="Scan barcode for size ${esc(z.size)}">📷</button></div>`).join("")}
    </div>
    <div class="box"><h3>எல்லா சைஸுக்கும் ஒரே நேரத்தில் கூட்ட / குறைக்க</h3>
      <div class="bump">${[-50,-20,-10,10,20,50].map(n=>`<button data-bump="${n}">${n>0?"+":"−"}₹${Math.abs(n)}</button>`).join("")}</div></div>
    <button class="cta leaf" id="itemEditSave">சேமி (Save)</button>
    <div class="two-b"><button class="cta warn" id="itemDel">🗑 ஐட்டம் நீக்கு</button><button class="cta ghost" id="itemEditCancel">ரத்து (Cancel)</button></div>`;
  $("#eTa").value=it.ta; $("#eEn").value=it.en;
  it.sizes.forEach((z,i)=>itemHint(i));
  showSheet();
}
async function saveItemEdit(){
  const it=byId[editItem]; if(!it) return;
  let ok=true; const vals={}, codes={};
  it.sizes.forEach((z,i)=>{
    const v=money(numIn($("#r"+i).value)), good=isFinite(v)&&v>0&&v<=999999;
    $("#rf"+i).classList.toggle("bad",!good); if(!good) ok=false; else vals[z.size]=v;
    codes[z.size]=cleanCode(($("#bc"+i)||{}).value);
  });
  const clash=codeClash(it.sizes.map(z=>({size:z.size,code:codes[z.size]})),editItem); if(clash){ toast(clash); return; }
  const ta=$("#eTa").value.trim(), en=$("#eEn").value.trim(), cat=$("#eCat").value;
  $("#fETa").classList.toggle("bad",!ta);
  if(!ok||!ta){ toast("பெயர் / ரேட்டை சரி பார்க்கவும்"); return; }
  const id=editItem;
  const done=await commitCatalog(d=>{
    const x=d.items.find(i=>i.id===id); if(!x) return false;
    x.ta=ta; x.en=en; if(d.cats.some(c=>c.id===cat)) x.cat=cat;
    x.sizes=x.sizes.map(z=>{ const n={size:z.size,rate:vals[z.size]!==undefined?vals[z.size]:z.rate}, c=codes[z.size]!==undefined?codes[z.size]:(z.code||""); if(c) n.code=c; return n; });
  },"சேமிக்கப்பட்டது: "+ta);
  if(!done) return;
  closeSheet(); renderAll();
}
async function deleteItem(){
  const it=byId[editItem]; if(!it) return;
  if(!confirm(`"${it.ta}" ஐட்டம் நிரந்தரமாக நீக்கப்படும். உறுதியா?`)) return;
  const id=editItem;
  if(await commitCatalog(d=>{ d.items=d.items.filter(i=>i.id!==id); },"ஐட்டம் நீக்கப்பட்டது: "+it.ta)){ closeSheet(); renderAll(); }
}

async function setupCompany(mode){
  const ok=await commitCatalog(d=>{ if(mode==="sample"){ const s=sampleCatalog(); d.cats=s.cats; d.items=s.items; } },
    mode==="sample"?"Sample குரூப்புகள் சேர்க்கப்பட்டன. பெயர், ரேட் மாற்றலாம்":"தயார்! முதலில் ஒரு புது குரூப் உருவாக்கவும்");
  if(ok){ renderAll(true); if(mode!=="sample") setTimeout(()=>openGroupForm(null),300); }
}

/* Phone camera: native BarcodeDetector (Android Chrome) or the bundled ZXing library (iPhone / others).
   USB / Bluetooth scanners type the code + Enter: caught anywhere on the billing screens. Camera needs HTTPS. */
const SCAN_FORMATS=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code","data_matrix"];
const cleanCode = c => String(c==null?"":c).replace(/[^\x21-\x7E]/g,"").slice(0,40);
let scanS=null, pendingCode=null;

/* returns an error text when a barcode in `sizes` is already used by another item / size (or twice in the list) */
function codeClash(sizes,itemId){
  const seen={};
  for(const z of sizes){
    if(!z.code) continue;
    if(seen[z.code]) return "ஒரே barcode இரண்டு சைஸில்: "+z.code;
    seen[z.code]=1;
    const h=byCode[z.code];
    if(h && !(h.id===itemId && h.size===z.size)) return "Barcode "+z.code+" ஏற்கனவே "+byId[h.id].ta+" ("+h.size+")-க்கு உள்ளது";
  }
  return "";
}
function loadZxing(){
  if(window.ZXing) return Promise.resolve();
  return loadZxing.p || (loadZxing.p=new Promise((ok,no)=>{ const sc=document.createElement("script"); sc.src="vendor/zxing.min.js"; sc.onload=ok; sc.onerror=()=>{ loadZxing.p=null; no(new Error("zxing")); }; document.head.appendChild(sc); }));
}
function zxFormats(){
  const F=ZXing.BarcodeFormat;
  return ["EAN_13","EAN_8","UPC_A","UPC_E","CODE_128","CODE_39","CODE_93","ITF","CODABAR","QR_CODE","DATA_MATRIX"].map(k=>F[k]).filter(v=>v!==undefined);
}
function scanMsg(t){ $("#scMsg").textContent=t||""; }
function scanResult(t,ok){
  const box=$("#scLast"), d=document.createElement("div");
  d.className=ok?"ok":"bad"; d.textContent=t; box.prepend(d);
  while(box.children.length>2) box.lastChild.remove();
}
function beep(ok){
  try{ navigator.vibrate&&navigator.vibrate(ok?60:[60,60,60]); }catch(e){}
  try{ const a=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)()); const o=a.createOscillator(), g=a.createGain();
    o.frequency.value=ok?1650:330; g.gain.value=.08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(ok?.09:.25)); }catch(e){}
}
async function openScanner(opts){
  closeScanner(true);
  const s=scanS={opts, last:"", lastAt:0};
  $("#scTitle").textContent=opts.title||"Barcode Scan";
  $("#scHint").textContent=opts.hint||"Barcode-ஐ மஞ்சள் கட்டத்திற்குள் வைக்கவும்";
  $("#scLast").innerHTML=""; $("#scCode").value=""; $("#scTorch").hidden=true; $("#scTorch").classList.remove("on");
  $("#scDone").textContent=opts.done||"✓ முடிந்தது";
  $("#scan").classList.add("on"); document.documentElement.classList.add("lock");
  try{ beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)()); }catch(e){}
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scanMsg("📵 Mobile camera-க்கு HTTPS link தேவை. கீழே barcode எண்ணை type செய்யலாம் / USB scanner பயன்படுத்தலாம்"); return;
  }
  scanMsg("📷 Camera திறக்கிறது…");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    if(scanS!==s){ stream.getTracks().forEach(t=>t.stop()); return; }
    s.stream=stream;
    const v=$("#scVideo"); v.srcObject=stream; try{ await v.play(); }catch(e){}
    const tr=stream.getVideoTracks()[0], cap=tr&&tr.getCapabilities?tr.getCapabilities():{};
    $("#scTorch").hidden=!cap.torch;
    if("BarcodeDetector" in window){
      try{ const sup=await BarcodeDetector.getSupportedFormats(), f=SCAN_FORMATS.filter(x=>sup.includes(x)); if(f.length) s.detector=new BarcodeDetector({formats:f}); }catch(e){}
    }
    if(!s.detector){
      await loadZxing();
      const H=new Map(); H.set(ZXing.DecodeHintType.TRY_HARDER,true); H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,zxFormats());
      s.zx=new ZXing.MultiFormatReader(); s.zx.setHints(H);
    }
    if(scanS!==s) return;
    scanMsg(""); scanLoop(s);
  }catch(e){
    if(scanS!==s) return;
    scanMsg(e&&e.name==="NotAllowedError" ? "📵 Camera அனுமதி மறுக்கப்பட்டது. Browser-ல் 🔒 → Camera → Allow செய்யவும். அல்லது எண்ணை type செய்யவும்"
          : e&&e.message==="zxing" ? "Scanner ஏற்ற முடியவில்லை. எண்ணை type செய்யவும்" : "📵 Camera திறக்க முடியவில்லை. எண்ணை type செய்யவும்");
  }
}
function scanLoop(s){
  if(scanS!==s) return;
  const v=$("#scVideo"), next=()=>{ if(scanS===s) s.timer=setTimeout(()=>scanLoop(s), s.detector?120:200); };
  if(v.readyState<2 || !v.videoWidth){ next(); return; }
  const W=v.videoWidth, H=v.videoHeight, cw=Math.round(W*.86), ch=Math.round(H*.6);
  const cv=s.cv||(s.cv=document.createElement("canvas"));
  if(cv.width!==cw) cv.width=cw; if(cv.height!==ch) cv.height=ch;
  const ctx=s.ctx||(s.ctx=cv.getContext("2d",{willReadFrequently:true}));
  ctx.drawImage(v,(W-cw)/2,(H-ch)/2,cw,ch,0,0,cw,ch);
  if(s.detector){
    s.detector.detect(cv).then(r=>{ if(r&&r.length) gotScan(r[0].rawValue); }).catch(()=>{}).finally(next);
  }else{
    try{ const r=s.zx.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))); if(r) gotScan(r.getText()); }
    catch(e){ /* nothing found in this frame */ }
    next();
  }
}
function gotScan(raw,manual){
  const s=scanS; if(!s) return;
  const code=cleanCode(raw); if(code.length<3){ if(manual) toast("சரியான barcode எண் இல்லை"); return; }
  const now=Date.now();
  // the same tag kept in front of the camera counts once; move it away (~1.2 s) and show it again for the next piece
  if(!manual && code===s.last && now-s.lastAt<1200){ s.lastAt=now; return; }
  s.last=code; s.lastAt=now;
  const keep=s.opts.onCode(code)===true;
  if(!keep && scanS===s) closeScanner();
}
function closeScanner(silent){
  const s=scanS; scanS=null;
  if(s){ clearTimeout(s.timer); if(s.stream) s.stream.getTracks().forEach(t=>t.stop()); }
  const v=$("#scVideo"); if(v) v.srcObject=null;
  $("#scan").classList.remove("on");
  if(!silent && !$("#sheet").classList.contains("on")) document.documentElement.classList.remove("lock");
  if(!silent && s && s.opts.onClose) s.opts.onClose();
}
async function toggleTorch(){
  const s=scanS, tr=s&&s.stream&&s.stream.getVideoTracks()[0]; if(!tr) return;
  const on=!$("#scTorch").classList.contains("on");
  try{ await tr.applyConstraints({advanced:[{torch:on}]}); $("#scTorch").classList.toggle("on",on); }catch(e){ toast("Torch இல்லை"); }
}

function scanToCart(code){
  const hit=byCode[code];
  if(hit && byId[hit.id]){
    const k=hit.id+"|"+hit.size; cart[k]=Math.min(99,(cart[k]||0)+1); save();
    refreshCard(hit.id); renderDock(); if($("#billList")) renderBillList();
    const it=byId[hit.id]; beep(true);
    const msg=`✅ ${it.ta} (${hit.size}) · ${inr(rateOf(hit.id,hit.size))} — பில்லில் ${cart[k]}`;
    if(scanS) scanResult(msg,true); else toast(msg);
    return true;
  }
  const cid=Object.keys(customs).find(i=>customs[i].code===code);
  if(cid){
    const c=customs[cid]; c.qty=Math.min(99,c.qty+1); save(); renderDock(); if($("#billList")) renderBillList(); beep(true);
    const msg=`✅ ${c.name}${c.size?" ("+c.size+")":""} — பில்லில் ${c.qty}`;
    if(scanS) scanResult(msg,true); else toast(msg);
    return true;
  }
  beep(false);
  const back=$("#billList")?"bill":"home";
  closeScanner(true); openUnknownCode(code,back);
  return false;
}

function stNum(){ const t=String($("#stVal").value).trim().replace(/[^\d-]/g,""); if(!/^-?\d+$/.test(t)) return NaN; return parseInt(t,10); }
function stPreview(){
  if(!stockEdit) return; const v=stNum(), cur=stQty(stockEdit.id,stockEdit.size), el=$("#stPrev");
  if(!isFinite(v)){ el.textContent="முழு எண் உள்ளிடவும் (எ.கா. 12 அல்லது -3)"; return; }
  const nv=stockEdit.mode==="set"?v:cur+v;
  el.innerHTML=`${cur} → <b style="color:${nv<0?"var(--bad)":"var(--leaf-d)"}">${nv}</b>${nv<0?" (மைனஸ்)":""}`;
}
async function saveStockEdit(){
  const e=stockEdit; if(!e) return; const v=stNum();
  if(!isFinite(v)||Math.abs(v)>999999){ toast("சரியான முழு எண் உள்ளிடவும்"); return; }
  const body={item:e.id,size:e.size}; if(e.mode==="set") body.qty=v; else body.add=v;
  if(stockData.branches) body.branch=stockData.branch;
  busy(true);
  try{
    const r=await api("stock","PUT",body); stockData.map[e.id+"|"+e.size]=r.stock;
    closeSheet(); renderView(); toast(`சேமிக்கப்பட்டது: ${byId[e.id].ta} (${e.size}) = ${r.stock.qty}`);
    stockEdit=null;
  }catch(x){ apiErr(x); } finally{ busy(false); }
}
function stockScan(){
  openScanner({title:"📦 ஸ்டாக் — Barcode Scan", hint:"Scan செய்த ஐட்டத்தின் ஸ்டாக் திறக்கும்", onCode:code=>{
    const h=byCode[code];
    if(!h){ beep(false); toast("இந்த barcode பட்டியலில் இல்லை: "+code); return true; }

  }});
}

const TA_MONTHS=["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"];
const TA_DAYS=["ஞாயிறு","திங்கள்","செவ்வாய்","புதன்","வியாழன்","வெள்ளி","சனி"];
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dParse = s => new Date(String(s).slice(0,10)+"T00:00:00");
const dLabel = s => { const d=dParse(s); return `${d.getDate()} ${TA_MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const dShort = s => { const d=dParse(s); return `${d.getDate()} ${TA_MONTHS[d.getMonth()].slice(0,3)}`; };
const mLabel = s => { const [y,m]=String(s).split("-"); return `${TA_MONTHS[Number(m)-1]} ${y}`; };
const inr0 = v => "₹"+Math.round(Number(v)||0).toLocaleString("en-IN");
const hLabel = h => { const a=h%12||12; return a+(h<12?" AM":" PM"); };
function chg(g,base){
  if(g==null) return `<span class="s">${base?esc(base):"ஒப்பிட தரவு இல்லை"}</span>`;
  const up=g>=0;
  return `<span class="s ${up?"up":"down"}">${up?"▲":"▼"} ${Math.abs(g)}%${base?" · "+esc(base):""}</span>`;
}

async function loadReport(date){
