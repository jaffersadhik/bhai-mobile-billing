<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b4a">
<title>Bhai Mobile Billing | பாய் மொபைல் பில்லிங்</title>
<meta name="description" content="Bhai Mobile Billing (பாய் மொபைல் பில்லிங்): நைட்டி, சுடிதார், குர்தா, பட்டியாலா, இன்னர் மற்றும் லேடீஸ் ஐட்டங்கள். சைஸ் தேர்வு செய்து பில் WhatsApp-ல் பெறுங்கள்.">
<meta property="og:title" content="Bhai Mobile Billing">
<meta property="og:description" content="கடைகளுக்கான மொபைல் பில்லிங் · சைஸ், ரேட், WhatsApp பில்.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Mukta+Malar:wght@600;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#0e6b4a; --leaf-d:#09442f; --leaf-l:#dff0e7;
  --gold:#e9b431; --gold-l:#fbe7ac;
  --ink:#14231c; --muted:#5f6f66; --line:#dbe6df;
  --bg:#f2f7f4; --card:#fff; --wa:#1faa59; --bad:#b3261e;
  --body:'DM Sans','Noto Sans Tamil','Latha','Nirmala UI',system-ui,sans-serif;
  --head:'Mukta Malar','DM Sans','Noto Sans Tamil','Latha',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);background:#d9e6de;color:var(--ink);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(9,68,47,.18);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* ---- app bar ---- */
.bar{position:sticky;top:0;z-index:20;background:var(--leaf);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.bar .mark{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--leaf-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:24px;flex:none}
.bar .back{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);font-size:22px;font-weight:700;flex:none}
.bar h1{font-family:var(--head);font-size:20px;line-height:1.15;font-weight:800}
.bar small{display:block;font-size:11.5px;opacity:.9;font-weight:600;color:var(--gold-l)}
.find{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:19;background:var(--bg);padding:10px 16px 8px}
.find input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px 0 42px;font-size:15px}
.find span{position:absolute;left:30px;top:50%;transform:translateY(-38%);font-size:16px;pointer-events:none}
.pad{padding:6px 16px 0}

/* ---- hero ---- */
.hero{margin-top:6px;border-radius:22px;padding:22px 18px;text-align:center;color:#fff;background:linear-gradient(150deg,#0e6b4a 0%,#09442f 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:8px;border:1.5px solid rgba(233,180,49,.65);border-radius:16px;pointer-events:none}
.hero .bis{font-family:var(--head);font-size:19px;font-weight:800;color:var(--gold)}
.hero h2{font-family:var(--head);font-size:32px;font-weight:800;line-height:1.15;margin-top:6px}
.hero p{margin-top:8px;font-size:13px;font-weight:600;opacity:.9}
.hero .pill{display:inline-block;margin-top:12px;background:var(--gold);color:var(--leaf-d);font-weight:700;font-size:13px;border-radius:20px;padding:5px 14px}

.how{background:var(--leaf-l);border-radius:18px;padding:14px;margin-top:14px}
.how ol{list-style:none;display:grid;gap:8px}
.how li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.how li i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}

.h2{font-family:var(--head);font-size:19px;font-weight:800;margin:20px 0 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;background:var(--tint,#fff);border-radius:20px;padding:14px 14px 12px;min-height:138px;display:flex;flex-direction:column;border:2px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .em{font-size:40px;line-height:1.1}
.tile b{font-family:var(--head);font-size:19px;font-weight:800;margin-top:auto;line-height:1.2}
.tile small{font-size:12px;color:var(--muted);font-weight:500}
.tile .cnt{font-size:11.5px;font-weight:700;color:var(--leaf-d);margin-top:3px}
.tile .got{position:absolute;top:10px;right:10px;background:var(--leaf);color:#fff;border-radius:11px;min-width:24px;height:24px;padding:0 8px;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.tile.has{border-color:var(--leaf)}

/* ---- item cards ---- */
.group{font-family:var(--head);font-weight:800;font-size:15px;margin:16px 0 6px;color:var(--leaf-d)}
.list{display:grid;gap:12px;margin-top:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.item .top{display:flex;gap:12px;align-items:center}
.item .ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex:none;background:var(--tint,#eef)}
.item .nm b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.item .nm small{font-size:12px;color:var(--muted)}
.lbl{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{position:relative;min-width:48px;height:40px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.sz.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sz i{position:absolute;top:-7px;right:-6px;background:var(--gold);color:var(--leaf-d);font-style:normal;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.buy{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.rate b{font-family:var(--head);font-size:24px;font-weight:800;color:var(--leaf-d);line-height:1}
.rate small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.add{min-width:92px;height:40px;border-radius:12px;border:1.5px solid var(--leaf);color:var(--leaf);font-weight:700;font-size:14.5px;background:#fff}
.step{display:flex;align-items:center;height:40px;border-radius:12px;background:var(--leaf);color:#fff;flex:none}
.step button{width:38px;height:40px;font-size:21px;font-weight:700;color:#fff}
.step span{min-width:34px;text-align:center;font-size:15px;font-weight:700}
.none{padding:46px 12px;text-align:center;color:var(--muted)}
.none b{display:block;font-size:42px;margin-bottom:6px}
footer{padding:26px 16px 8px;text-align:center;font-size:12.5px;color:var(--muted)}
footer a{color:var(--leaf);font-weight:700}

/* ---- dock ---- */
.dock{position:fixed;left:50%;bottom:0;transform:translate(-50%,120%);width:min(100%,480px);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(242,247,244,0));z-index:30;transition:transform .22s}
.dock.show{transform:translate(-50%,0)}
.dock button{width:100%;height:58px;border-radius:16px;background:var(--leaf);color:#fff;display:flex;align-items:center;gap:10px;padding:0 18px;box-shadow:0 8px 22px rgba(9,68,47,.35);font-weight:700;font-size:15.5px}
.dock .n{background:var(--gold);color:var(--leaf-d);border-radius:10px;padding:2px 10px;font-size:14px;font-weight:800}
.dock .tot{font-family:var(--head);font-size:20px;font-weight:800}
.dock .go{margin-left:auto;font-size:14.5px}

/* ---- bill sheet ---- */
.veil{position:fixed;inset:0;background:rgba(10,30,22,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,480px);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:50;transform:translate(-50%,105%);transition:transform .26s ease;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{font-family:var(--head);font-size:21px;font-weight:800;padding-right:44px}
.sheet .sub{font-size:13px;color:var(--muted);margin:2px 0 6px}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:#fff;font-weight:800;font-size:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.box h3{font-size:14px;font-weight:700;margin-bottom:6px}
.bl{padding:9px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border:0}
.bl .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bl .nm{font-size:14.5px;font-weight:700;line-height:1.25}
.bl .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.bl .amt{font-family:var(--head);font-weight:800;font-size:17px;white-space:nowrap}
.bl .r2{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;font-weight:600;color:var(--muted)}
.bl .r2 b{color:var(--ink)}
.bl .step{height:34px}
.bl .step button{height:34px;width:34px}
.sum{background:var(--leaf-l);border-radius:16px;padding:14px;margin-top:12px}
.sum div{display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding:3px 0}
.sum .gt{border-top:1.5px dashed var(--leaf);margin-top:6px;padding-top:10px;font-family:var(--head);font-size:24px;font-weight:800;color:var(--leaf-d)}
.fld{display:block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:#fff}
.fld .err{display:none;color:var(--bad);font-size:12px;font-weight:600;margin-top:3px}
.fld.bad input{border-color:var(--bad)}
.fld.bad .err{display:block}
.pre{display:flex;gap:8px}
.pre b{display:grid;place-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;margin-top:4px;font-size:16px}
.pre .fldin{flex:1}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;height:54px;border-radius:15px;background:var(--wa);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.cta.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.manual{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;background:#fff;border:2px dashed var(--leaf);border-radius:18px;padding:12px 14px}
.manual .pl{width:42px;height:42px;border-radius:13px;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.manual b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.manual small{font-size:12px;color:var(--muted);font-weight:500}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.qtyrow .step{height:44px}.qtyrow .step button{height:44px;width:46px}
.prev{margin-top:14px;background:var(--leaf-l);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.prev b{font-family:var(--head);font-size:22px;color:var(--leaf-d)}
.ok{text-align:center;padding-top:6px}
.ok .tick{width:68px;height:68px;border-radius:50%;background:var(--leaf-l);display:grid;place-items:center;font-size:32px;margin:0 auto 8px}
.ok pre{text-align:left;white-space:pre-wrap;word-break:break-word;font:500 12.5px/1.55 var(--body);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,24px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.22s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock{overflow:hidden}
/* ---- login ---- */
body:not(.authed) .app, body:not(.authed) .dock{display:none}
body.authed .login{display:none}
.login{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#0e6b4a 0%,#09442f 100%);color:#fff;box-shadow:0 0 40px rgba(9,68,47,.18)}
.login .brand{text-align:center;margin-bottom:22px}
.login .lmark{width:72px;height:72px;border-radius:22px;background:var(--gold);color:var(--leaf-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:40px;margin:0 auto 12px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.login .bis{font-family:var(--head);font-size:16px;font-weight:800;color:var(--gold)}
.login h1{font-family:var(--head);font-size:28px;font-weight:800;line-height:1.15;margin-top:4px}
.login .tag{font-size:13px;font-weight:600;opacity:.85;margin-top:4px}
.lcard{background:var(--bg);color:var(--ink);border-radius:22px;padding:20px 16px;box-shadow:0 14px 34px rgba(0,0,0,.25);position:relative}
.lcard::before{content:"";position:absolute;left:24px;right:24px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--gold)}
.lcard h2{font-family:var(--head);font-size:21px;font-weight:800}
.lcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
.pw{position:relative}
.pw input{padding-right:52px}
.pw .eye{position:absolute;right:4px;bottom:4px;width:44px;height:42px;border-radius:10px;font-size:18px}
.rem{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13.5px;font-weight:600}
.rem input{width:20px;height:20px;accent-color:var(--leaf)}
.lerr{display:none;margin-top:12px;background:#fdecea;color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.lerr.on{display:block}
.lcard .cta{background:var(--leaf)}
.lcard .cta:disabled{opacity:.55;cursor:not-allowed}
.lfoot{text-align:center;font-size:12px;opacity:.75;margin-top:18px}
.bar > div{flex:1;min-width:0}
.bar .out{flex:none;height:42px;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;padding:0 10px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;max-width:96px}
.bar .out span{font-size:16px}
.bar .out em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
/* ---- rate change ---- */
.item .nm{flex:1;min-width:0}
.edit{flex:none;align-self:flex-start;height:34px;padding:0 10px;border-radius:10px;background:var(--gold-l);color:var(--leaf-d);font-size:12.5px;font-weight:800;border:1.5px solid var(--gold)}
.chg{display:inline-block;margin-left:6px;background:var(--gold);color:var(--leaf-d);font-size:10.5px;font-weight:800;border-radius:8px;padding:1px 7px;vertical-align:middle}
.rate .was{font-size:11px;color:var(--muted);text-decoration:line-through;font-weight:600;margin-left:6px}
.rrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rrow .szb{height:44px;border-radius:12px;background:var(--leaf-l);color:var(--leaf-d);display:grid;place-items:center;font-weight:800;font-size:14px;text-align:center;line-height:1.1;padding:0 4px}
.rrow .fld{margin-top:0}
.rrow .fld input{margin-top:0}
.rrow .def{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px}
.rrow .def.up{color:var(--leaf)}
.rrow .def.dn{color:var(--bad)}
.bump{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.bump button{height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.admin{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;background:var(--gold-l);border:2px solid var(--gold);border-radius:18px;padding:12px 14px}
.admin .pl{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--leaf-d);display:grid;place-items:center;font-size:21px;flex:none}
.admin b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.admin small{font-size:12px;color:var(--muted);font-weight:500}
.cl{padding:10px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border:0}
.cl .r1{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cl b{font-size:14.5px}
.cl .ch{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.6}
.cl .ch s{opacity:.8}
.cl .ch strong{color:var(--leaf-d)}
.mini{height:32px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;flex:none}
.cta.leaf{background:var(--leaf)}
.cta.warn{background:#fff;color:var(--bad);border:1.5px solid #f0c9c6}
.two-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two-b .cta{margin-top:10px}
/* ---- groups & permanent items ---- */
.fld select{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:#fff;color:var(--ink);font-family:inherit}
.fld.bad select{border-color:var(--bad)}
.gtools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.gbtn{height:40px;padding:0 14px;border-radius:12px;background:var(--gold-l);border:1.5px solid var(--gold);color:var(--leaf-d);font-weight:800;font-size:13.5px}
.gbtn.plain{background:#fff;border-color:var(--line);color:var(--ink)}
.tile.addt{background:#fff;border:2px dashed var(--leaf);align-items:flex-start}
.tile.addt .em{width:46px;height:46px;border-radius:14px;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700}
.tile .new{position:absolute;top:10px;right:10px;background:var(--gold);color:var(--leaf-d);border-radius:9px;padding:1px 8px;font-size:10.5px;font-weight:800}
.tile.has .new{display:none}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.picks button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px}
.picks button.on{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf-l)}
.picks .sw{background:var(--c)}
.gprev{display:flex;align-items:center;gap:12px;margin-top:14px;border-radius:16px;padding:12px;background:var(--tint)}
.gprev .em{font-size:34px}
.gprev b{font-family:var(--head);font-size:18px;display:block;line-height:1.2}
.gprev small{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{height:38px;padding:0 12px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.chips button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.fillrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:6px}
.fillrow .fld{margin-top:0}
.fillrow button{height:48px;padding:0 14px;border-radius:12px;background:var(--leaf);color:#fff;font-weight:700;font-size:13.5px}
.hint{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px}
.perm{margin-top:14px;background:var(--gold-l);border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px}
.perm .rem{margin-top:0}
.perm .fld{margin-top:8px}
/* ---- app name / company ---- */

[hidden]{display:none!important}

.busy span{width:46px;height:46px;border-radius:50%;border:4px solid var(--leaf-l);border-top-color:var(--leaf);animation:spin .8s linear infinite}

.warnbox{display:flex;align-items:center;gap:10px;margin-top:12px;background:#fff4e5;border:1.5px solid #f3c27a;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;color:#7a4a00}

.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 14px}
.choice:active{border-color:var(--leaf)}

.acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}

.acard .r1>div{min-width:0}

.acard small{font-size:12px;color:var(--muted);font-weight:600}
.acard .meta{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px;line-height:1.6}

<body>
<section class="login" id="login" aria-label="Login">
  <div class="brand">
    <div class="lmark" aria-hidden="true">ப</div>
    <div class="bis" id="lBis"></div>
    <h1 class="appn" id="lApp"></h1>
    <p class="appta" id="lAppTa"></p>
    <p class="tag">கடைகளுக்கான மொபைல் பில்லிங் · Mobile Billing for shops</p>
  </div>
  <form class="lcard" id="loginForm" novalidate autocomplete="on">
    <h2>உள்நுழைவு (Login)</h2>
    <p class="sub">உங்கள் பயனர் பெயர், கடவுச்சொல்லை உள்ளிடவும்</p>
    <label class="fld">பயனர் பெயர் (Username)<input id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="fld">கடவுச்சொல் (Password)
      <div class="pw"><input id="lPass" type="password" autocomplete="current-password" required><button type="button" class="eye" id="lEye" aria-label="Show password">👁</button></div></label>
    <label class="rem"><input type="checkbox" id="lRem" checked>இந்த மொபைலில் நினைவில் வை (Stay logged in)</label>
    <div class="lerr" id="lErr" role="alert"></div>
    <button class="cta" id="lBtn" type="submit">உள்நுழை (Login)</button>
  </form>
  <p class="lfoot">பதிவு செய்த கடைகளுக்கு மட்டும் · Registered shops only</p>
</section>
<div class="app">
  <header class="bar" id="bar"></header>
  <div class="find" id="findBox"><span aria-hidden="true">🔍</span><input id="q" type="search" autocomplete="off" aria-label="Search items"></div>
  <main class="pad" id="view"></main>
  <footer>
    <p><strong id="footCo"></strong></p>
    <p id="footAddr" style="margin-top:2px"></p>
    <p id="callLine" style="margin-top:4px"></p>
    <p class="pw-by" id="footApp"></p>
  </footer>
</div>

<div class="dock" id="dock"><button id="openBill" aria-label="View bill"><span class="n" id="dockN">0</span><span class="tot" id="dockT">₹0</span><span class="go">View bill ›</span></button></div>
<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
  <button class="x" data-close aria-label="Close">✕</button>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy" aria-hidden="true"><span></span></div>

<script>
/* ================= EDIT HERE ================= */
const APP_NAME     = "Bhai Mobile Billing";
const APP_NAME_TA  = "பாய் மொபைல் பில்லிங்";
const BISMILLAH    = "அல்லாஹ்வின் திருப்பெயரால்";
const COUNTRY_CODE = "91";          // WhatsApp bills go to COUNTRY_CODE + customer's 10-digit mobile
const API_BASE     = "api/";        // server API inside the same WAR (users, companies, groups, items, bills are stored on the server)

/* size sets */
const SIZES = {
  alpha:  ["M","L","XL","XXL"],
  alpha5: ["S","M","L","XL","XXL"],
  alpha3: ["M","L","XL"],
  alpha4s:["S","M","L","XL"],
  chest:  ["36","38","40","42","44"],
  bra:    ["32","34","36","38","40"],
  free:   ["Free size"]
};

/* SAMPLE groups & items - copied into a new company only when it chooses "Sample groups" on first login.
   groups: id, Tamil, English, emoji, tile colour      items: [Tamil, English, size set, rate of first size, rate step per size] */
const SAMPLE_CATS = [
  ["nighty","நைட்டி","Nighty","🌙","#e3e9ff"],
  ["churidar","சுடிதார்","Churidar","👗","#ffe1ea"],
  ["kurta","குர்தா","Kurta","👚","#dff1d8"],
  ["patiala","பட்டியாலா","Patiala","👖","#fff0c9"],
  ["inner","இன்னர்","Innerwear","🩱","#f1e4f6"],
  ["leggings","லெக்கிங்ஸ்","Leggings","🩳","#ffe7d2"],
  ["dupatta","துப்பட்டா","Dupatta & Scarf","🧣","#dcefec"]
];
const SAMPLE_RAW = {
 nighty:[["காட்டன் நைட்டி","Cotton Nighty","alpha",250,10],["பிரிண்டட் நைட்டி","Printed Nighty","alpha",300,20],["ஃபேன்சி நைட்டி","Fancy Nighty","alpha",380,20],["நைட் சூட் செட்","Night Suit Set","alpha",450,30]],
 churidar:[["காட்டன் சுடிதார் செட்","Cotton Churidar Set","chest",450,20],["பிரிண்டட் சுடிதார் செட்","Printed Churidar Set","chest",550,20],["டிசைனர் சுடிதார் செட்","Designer Churidar Set","chest",850,30],["சுடிதார் பாட்டம்","Churidar Bottom","chest",150,10]],
 kurta:[["காட்டன் குர்தா","Cotton Kurta","alpha5",300,20],["பிரிண்டட் குர்தா","Printed Kurta","alpha5",350,20],["ரேயான் குர்தா","Rayon Kurta","alpha5",400,20],["லாங் குர்த்தி","Long Kurti","alpha5",450,25]],
 patiala:[["பட்டியாலா பேண்ட்","Patiala Pant","alpha",220,10],["காட்டன் பட்டியாலா செட்","Cotton Patiala Set","alpha",480,20],["பிரிண்டட் பட்டியாலா செட்","Printed Patiala Set","alpha",520,20]],
 inner:[["பிரா","Bra","bra",120,5],["பேண்டீஸ்","Panty","alpha",40,5],["பாவாடை (ஸ்லிப்)","Slip / Petticoat","alpha3",120,10],["கேமிசோல்","Camisole","alpha4s",80,5]],
 leggings:[["காட்டன் லெக்கிங்ஸ்","Cotton Leggings","alpha",180,10],["ஆங்கிள் லெங்த் லெக்கிங்ஸ்","Ankle Length Leggings","alpha",200,10],["சுடிதார் லெக்கிங்ஸ்","Churidar Leggings","alpha",190,10]],
 dupatta:[["காட்டன் துப்பட்டா","Cotton Dupatta","free",120,0],["ஷிஃபான் துப்பட்டா","Chiffon Dupatta","free",150,0],["ஸ்கார்ஃப்","Scarf","free",80,0]]
};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const inr = v => { const n=Number(v)||0; return "₹" + n.toLocaleString("en-IN",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}); };
const money = n => Math.round(n*100)/100;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseKey = k => { const i=k.lastIndexOf("|"); return [k.slice(0,i),k.slice(i+1)]; };
const newId = p => p + Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36);
const numIn = v => parseFloat(String(v==null?"":v).replace(/,/g,""));
const fmtDate = iso => { const d=new Date(iso); return isNaN(d) ? String(iso||"") : d.toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}); };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2600); }
let busyN=0;
function busy(on){ busyN=Math.max(0,busyN+(on?1:-1)); $("#busy").classList.toggle("on",busyN>0); }

/* ================= SERVER API ================= */
const TOKEN_KEY="bmb_token";
let token=null;
try{ token=localStorage.getItem(TOKEN_KEY)||sessionStorage.getItem(TOKEN_KEY); }catch(e){}
function setToken(t,remember){
  token=t||null;
  try{ localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); if(t) (remember?localStorage:sessionStorage).setItem(TOKEN_KEY,t); }catch(e){}
}
async function api(path,method,body){
  let r;
  try{
    r=await fetch(API_BASE+path,{method:method||"GET",cache:"no-store",
      headers:Object.assign({"Content-Type":"application/json"},token?{"X-Auth":token}:{}),
      body:body===undefined?undefined:JSON.stringify(body)});
  }catch(e){ const er=new Error("Server-ஐ அணுக முடியவில்லை. Internet / server-ஐ சரி பார்க்கவும்"); er.status=0; throw er; }
  let data=null; try{ data=await r.json(); }catch(e){}
  if(r.status===401 && path!=="login") sessionExpired((data&&data.error)||"");
  if(!r.ok){ const er=new Error((data&&data.error)||("Server error "+r.status)); er.status=r.status; throw er; }
  return data||{};
}
function apiErr(e){ if(e && e.status!==401) toast(e.message||"Error"); }

/* ================= STATE ================= */
let me=null, company=null, defaultPw=false, adminData=null;
let catalog={version:0,setup:false,cats:[],items:[]};
let CATS=[], ITEMS=[], byId={}, catById={};
let cart={}, sel={}, customs={};
let customQty=1, customFrom="home", customCat=null, cameFromHome=false;

const isAdmin = () => !!(me && me.type==="admin");
const canEdit = () => !!(me && company);     // admin (inside an opened company) and customer users can manage groups / items

function buildCatalog(){
  CATS=(catalog.cats||[]).map(c=>[c.id,c.ta,c.en||"",c.emoji||"🛍️",c.color||"#e8eef0"]);
  catById={}; CATS.forEach(c=>catById[c[0]]=c);
  ITEMS=[]; byId={};
  CATS.forEach(c=>(catalog.items||[]).filter(x=>x.cat===c[0]).forEach(x=>{
    const it={id:x.id,cat:x.cat,ta:x.ta,en:x.en||"",emoji:c[3],sizes:x.sizes.map(z=>({size:z.size,rate:Number(z.rate)}))};
    ITEMS.push(it); byId[it.id]=it;
  }));
}
function sampleCatalog(){
  const cats=SAMPLE_CATS.map(c=>({id:c[0],ta:c[1],en:c[2],emoji:c[3],color:c[4]})), items=[];
  SAMPLE_CATS.forEach(c=>(SAMPLE_RAW[c[0]]||[]).forEach(r=>items.push({
    id:"s_"+c[0]+"_"+r[1].toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""), cat:c[0], ta:r[0], en:r[1],
    sizes:SIZES[r[2]].map((sz,i)=>({size:sz,rate:r[3]+r[4]*i}))})));
  return {cats,items};
}
async function loadData(){ const r=await api("data"); company=r.company; catalog=r.catalog; buildCatalog(); }

/* cart is kept on this phone, separately for every company */
const ck = n => "bmb_"+n+"_"+(company?company.id:"x");
function loadCart(){
  cart={}; customs={}; sel={};
  try{ const s=JSON.parse(localStorage.getItem(ck("cart"))||"{}"); for(const k in s){ const [id,size]=parseKey(k); if(byId[id]&&byId[id].sizes.some(z=>z.size===size)&&s[k]>0) cart[k]=Math.min(99,s[k]|0); } }catch(e){}
  try{ const c=JSON.parse(localStorage.getItem(ck("custom"))||"{}"); for(const id in c){ const v=c[id]; if(v&&v.name&&v.rate>0&&v.qty>0) customs[id]={name:String(v.name),size:String(v.size||""),rate:Number(v.rate),qty:Math.min(99,v.qty|0)}; } }catch(e){}
}
function save(){ if(!company) return; try{ localStorage.setItem(ck("cart"),JSON.stringify(cart)); localStorage.setItem(ck("custom"),JSON.stringify(customs)); }catch(e){} }
function purgeCart(){ for(const k in cart){ const [id,size]=parseKey(k); if(!byId[id]||!byId[id].sizes.some(z=>z.size===size)) delete cart[k]; } save(); }

/* every change to groups/items is saved on the server (with a version check, so two phones can't overwrite each other) */
let catBusy=false;
async function commitCatalog(mutate,okMsg){
  if(catBusy){ toast("சேமிக்கப்படுகிறது, காத்திருக்கவும்…"); return false; }
  const draft=JSON.parse(JSON.stringify({cats:catalog.cats||[],items:catalog.items||[]}));
  if(mutate(draft)===false){ toast("தரவு மாறியுள்ளது. மீண்டும் முயற்சிக்கவும்"); return false; }
  catBusy=true; busy(true);
  try{
    const r=await api("catalog","PUT",{version:catalog.version,cats:draft.cats,items:draft.items});
    catalog=r.catalog; buildCatalog(); purgeCart();
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){
    if(e.status===409){ toast("வேறு மொபைலில் மாற்றம் நடந்தது — புதிய தரவு ஏற்றப்பட்டது. மீண்டும் முயற்சிக்கவும்"); try{ await loadData(); purgeCart(); }catch(x){} closeSheet(); renderAll(); }
    else apiErr(e);
    return false;
  }finally{ catBusy=false; busy(false); }
}

/* ================= CART HELPERS ================= */
const rateOf = (id,size) => byId[id].sizes.find(z=>z.size===size).rate;
const selSize = id => (byId[id].sizes.some(z=>z.size===sel[id]) ? sel[id] : byId[id].sizes[0].size);
const lines = () => {
  const cat = Object.keys(cart).filter(k=>{ const [id,size]=parseKey(k); return byId[id]&&byId[id].sizes.some(z=>z.size===size); })
    .map(k=>{ const [id,size]=parseKey(k); const it=byId[id], rate=rateOf(id,size); return {k,it,size,rate,qty:cart[k],amt:money(rate*cart[k])}; })
    .sort((a,b)=>ITEMS.indexOf(a.it)-ITEMS.indexOf(b.it));
  const cus = Object.keys(customs).map(id=>{ const c=customs[id]; return {k:"c:"+id,it:{ta:c.name,en:"",custom:true},size:c.size,rate:c.rate,qty:c.qty,amt:money(c.rate*c.qty)}; });
  return cat.concat(cus);
};
const pieces = () => lines().reduce((a,l)=>a+l.qty,0);
const grand  = () => money(lines().reduce((a,l)=>a+l.amt,0));

/* ================= VIEWS ================= */
function view(){
  if(!me) return "none";
  const h=location.hash.slice(1);
  if(h==="admin" && isAdmin()) return "admin";
  if(!company) return isAdmin() ? "admin" : "nocompany";
  if(!catalog.setup) return "setup";
  if(catById[h]) return "cat";
  return "home";
}
const curCat = () => view()==="cat" ? catById[location.hash.slice(1)] : null;
function coMark(){
  const n=String(company?company.name:"ப").trim()||"ப";
  try{ if(window.Intl&&Intl.Segmenter){ const f=new Intl.Segmenter("ta",{granularity:"grapheme"}).segment(n)[Symbol.iterator]().next().value; if(f) return f.segment; } }catch(e){}
  return Array.from(n)[0];
}
function renderBrand(){
  document.title = company ? `${company.name} | ${APP_NAME}` : `${APP_NAME} | ${APP_NAME_TA}`;
  $("#footCo").textContent = company ? company.name : APP_NAME;
  $("#footAddr").textContent = company ? [company.address,company.city].filter(Boolean).join(", ") : "";
  const ph = company && company.phone;
  $("#callLine").innerHTML = ph ? `அழைக்க: <a href="tel:+${COUNTRY_CODE}${esc(ph)}">${esc(ph)}</a>` : "";
  $("#footApp").innerHTML = company ? `Powered by <b>${esc(APP_NAME)}</b>` : "";
}
function renderBar(){
  const v=view(), c=curCat();
  let left;
  if(c) left=`<button class="back" id="back" aria-label="Back">←</button><div><h1>${esc(c[1])}</h1><small>${esc(c[2])}</small></div>`;
  else if(v==="admin") left=`${company?`<button class="back" id="toHome" aria-label="Back to billing">←</button>`:`<div class="mark" aria-hidden="true">⚙</div>`}<div><span class="appline">${esc(APP_NAME)}</span><h1 class="co">Admin Panel</h1></div>`;
  else left=`<div class="mark" aria-hidden="true">${esc(coMark())}</div><div><span class="appline">${esc(APP_NAME)}</span><h1 class="co">${esc(company?company.name:APP_NAME)}</h1></div>`;
  $("#bar").innerHTML = left + (me?`<button class="out" id="menuBtn" aria-label="Menu"><span aria-hidden="true">☰</span><em>${esc(me.user)}</em></button>`:"");
  $("#findBox").hidden = !(v==="home"||v==="cat");
  $("#q").placeholder = c ? `${c[1]} பகுதியில் தேடு` : "எல்லா ஐட்டங்களிலும் தேடு (Search)";
}
function heroHtml(){

function change(key,dir){
  if(key.startsWith("c:")){
    const id=key.slice(2), c=customs[id]; if(!c) return;
    const n=c.qty+dir; if(n<=0) delete customs[id]; else c.qty=Math.min(n,99);
    save(); renderDock(); if($("#sheet").classList.contains("on")) renderBillList(); return;
  }

  save(); refreshCard(parseKey(key)[0]); renderDock();

}

  const addr=[c.address,c.city].filter(Boolean).join(", "); if(addr) out.push(addr);
  const ph=[c.phone?`📞 ${c.phone}`:"", c.gstin?`GSTIN: ${c.gstin}`:""].filter(Boolean).join(" · "); if(ph) out.push(ph);
  out.push("",`பில் எண்: ${b.no}`,fmtDate(b.at));
  if(b.customer) out.push(`வாடிக்கையாளர்: ${b.customer}`);
  if(b.by) out.push(`பில் போட்டவர்: ${b.by}`);
  out.push("");
  (b.lines||[]).forEach((l,i)=>out.push(`${i+1}. ${l.name}${l.en?` (${l.en})`:""}`,`    ${l.size?`Size: ${l.size} | `:""}${l.qty} x ${inr(l.rate)} = ${inr(l.amt)}`));
  out.push("",`மொத்த எண்ணிக்கை: ${b.pieces} pcs`,`*மொத்த தொகை: ${inr(b.total)}*`,"",c.footer||"நன்றி! மீண்டும் வருக 🙏","",`_${APP_NAME}_`);
  return out.join("\n");
}

  if(!okN||!okR){ toast("பெயர் மற்றும் ரேட்டை சரி பார்க்கவும்"); return; }
  if(canEdit() && $("#cPerm") && $("#cPerm").checked){
    const cat=$("#cCat").value; if(!catById[cat]){ toast("குரூப்பை தேர்வு செய்யவும் / உருவாக்கவும்"); return; }
    const sz=(size||"Free size").replace(/\|/g,"/").slice(0,12);
    const ex=(catalog.items||[]).find(i=>i.cat===cat && i.ta.toLowerCase()===name.toLowerCase());
    const id=ex?ex.id:newId("u"), qty=customQty, from=customFrom;
    const ok=await commitCatalog(d=>{
      const x=d.items.find(i=>i.id===id);
      if(x){ const z=x.sizes.find(z=>z.size===sz); if(z) z.rate=rate; else x.sizes.push({size:sz,rate}); }
      else d.items.push({id,cat,ta:name.slice(0,60),en:"",sizes:[{size:sz,rate}]});
    });
    if(!ok) return;
    const k=id+"|"+sz; if(byId[id]&&byId[id].sizes.some(z=>z.size===sz)){ cart[k]=Math.min(99,(cart[k]||0)+qty); save(); }
    renderAll(); toast("நிரந்தரமாக சேமிக்கப்பட்டது: "+catById[cat][1]+" › "+name);
    if(from==="bill") openBill(); else closeSheet();
    return;
  }
  let id=Object.keys(customs).find(i=>{ const c=customs[i]; return c.name.toLowerCase()===name.toLowerCase() && c.size.toLowerCase()===size.toLowerCase() && c.rate===rate; });
  if(id) customs[id].qty=Math.min(99,customs[id].qty+customQty);
  else { id="x"+Date.now().toString(36)+Math.floor(Math.random()*1000); customs[id]={name,size,rate,qty:customQty}; }
  save(); renderDock(); toast("சேர்க்கப்பட்டது: "+name);
  if(customFrom==="bill") openBill(); else closeSheet();
}

    const r=await api("login","POST",{user:u,pass:p,remember:$("#lRem").checked});
    setToken(r.token,$("#lRem").checked); $("#lPass").value="";
    await enter(r);
    toast("வணக்கம், "+me.name+(company?" · "+company.name:""));
  }catch(err){ lerr(err.message); $("#lPass").value=""; $("#lPass").focus(); }

}

document.addEventListener("click",e=>{

  const d=t.dataset;
  /* menu & account */
  if(t.id==="menuBtn") return openMenu();
  if(t.id==="mBills"||t.id==="billHist") return openBills();

  if(t.id==="mEditCompany"){ (adminData?Promise.resolve():loadAdmin()).then(()=>openCompanyForm(company.id)); return; }
  if(t.id==="mAdmin"){ closeSheet(); if(location.hash!=="#admin") location.hash="admin"; else loadAdmin(); return; }
  if(t.id==="mPw"||t.id==="chgPw") return openPw();
  if(t.id==="pwSave") return savePw();
  if(t.id==="mLogout") return logout();
  if(t.id==="toHome"){ location.hash=""; return; }
  /* admin */
  if(t.id==="addCompany") return openCompanyForm(null);
  if(d.editcomp) return openCompanyForm(d.editcomp);
  if(d.opencomp) return openCompanyBilling(d.opencomp);
  if(d.adduserfor){ openUserForm(null,{type:"customer",companyId:d.adduserfor}); return; }
  if(t.id==="addUser") return openUserForm(null);
  if(d.edituser) return openUserForm(d.edituser);
  if(d.deluser) return deleteUser(d.deluser);
  if(d.utype){ uForm.type=d.utype; syncUType(); return; }
  if(t.id==="uGen"){ const a="abcdefghjkmnpqrstuvwxyz23456789"; let p=""; const r=new Uint32Array(8); crypto.getRandomValues(r); r.forEach(x=>p+=a[x%a.length]); $("#uPass").value=p; $("#fuPass").classList.remove("bad"); return; }
  if(t.id==="userSave") return saveUser();
  if(t.id==="userCancel"){ uForm=null; closeSheet(); return; }
  if(t.id==="compSave") return saveCompany();
  if(t.id==="compDel") return deleteCompany();
  if(t.id==="compCancel"){ const r=kForm&&kForm.ret; kForm=null; if(r&&r.type==="user"){ r.draft.companyId=""; openUserForm(r.draft.id,r.draft); } else closeSheet(); return; }
  if(t.id==="credCopy") return copyText($("#credTxt").textContent);
  /* setup */
  if(t.id==="setupSample") return setupCompany("sample");
  if(t.id==="setupEmpty") return setupCompany("empty");
  /* groups & items */
  if(t.id==="addGroup") return openGroupForm(null);
  if(d.editgroup) return openGroupForm(d.editgroup);
  if(d.additem) return openItemForm(d.additem);
  if(d.gemoji){ gForm.emoji=d.gemoji; document.querySelectorAll("[data-gemoji]").forEach(b=>b.classList.toggle("on",b===t)); groupPreview(); return; }
  if(d.gcolor){ gForm.color=d.gcolor; document.querySelectorAll("[data-gcolor]").forEach(b=>b.classList.toggle("on",b===t)); groupPreview(); return; }
  if(t.id==="groupSave") return saveGroup();
  if(t.id==="groupDel") return deleteGroup();
  if(t.id==="groupCancel"){ const r=gForm&&gForm.ret; gForm=null;
    if(r&&r.type==="item") openItemForm(r.draft.cat,r.draft); else if(r&&r.type==="custom") openCustom(r.from,"",{draft:r.draft}); else closeSheet(); return; }
  if(d.iset){ keepIVals(); iForm.set=d.iset; document.querySelectorAll("[data-iset]").forEach(b=>b.classList.toggle("on",b===t)); $("#fISizes").hidden=iForm.set!=="custom"; renderIRows(); if(iForm.set==="custom") $("#iSizes").focus(); return; }
  if(t.id==="itemFill"){ const b=numIn($("#iBase").value), st=numIn($("#iStep").value)||0;
    if(!isFinite(b)||b<=0){ toast("முதல் சைஸ் ரேட்டை உள்ளிடவும்"); $("#iBase").focus(); return; }
    document.querySelectorAll("[data-isz]").forEach((inp,i)=>{ inp.value=money(b+st*i); $("#if"+i).classList.remove("bad"); }); keepIVals(); return; }
  if(t.id==="itemSave") return saveItem();
  if(t.id==="itemCancel"){ iForm=null; closeSheet(); return; }
  if(d.edit) return openItemEdit(d.edit);
  if(d.bump){ const n=Number(d.bump), it=byId[editItem]; if(!it) return; it.sizes.forEach((z,i)=>{ const v=numIn($("#r"+i).value); const nv=money((isFinite(v)?v:z.rate)+n); $("#r"+i).value=nv>0?nv:1; $("#rf"+i).classList.remove("bad"); itemHint(i); }); return; }
  if(t.id==="itemEditSave") return saveItemEdit();
  if(t.id==="itemDel") return deleteItem();
  if(t.id==="itemEditCancel"){ closeSheet(); return; }
  /* custom item */
  if(t.hasAttribute("data-custom")) return openCustom("home",d.prefill||"");
  if(t.id==="addCustomBill") return openCustom("bill","");
  if(d.cq){ customQty=Math.max(1,Math.min(99,customQty+(d.cq==="inc"?1:-1))); $("#cQty").textContent=customQty; updateCustomTotal(); return; }
  if(t.id==="customAdd") return submitCustom();
  if(t.id==="customCancel"){ if(customFrom==="bill" && lines().length) openBill(); else closeSheet(); return; }
  /* billing */
  if(d.size!==undefined && t.closest("[data-item]")){ const id=t.closest("[data-item]").dataset.item; sel[id]=d.size; refreshCard(id); return; }
  if(d.act){
    const h=t.closest("[data-key],[data-item]"); if(!h) return;
    const key=h.dataset.key || (h.dataset.item+"|"+selSize(h.dataset.item));
    change(key,d.act==="inc"?1:-1); return;
  }
  if(d.cat){ cameFromHome=true; $("#q").value=""; location.hash=d.cat; return; }
  if(t.id==="back"){ $("#q").value=""; if(cameFromHome && history.length>1) history.back(); else location.hash=""; return; }
  if(t.id==="openBill") return openBill();
  if(t.id==="send") return sendBill();
  if(t.id==="clearAll"){ if(!confirm("பில்லில் உள்ள எல்லாவற்றையும் நீக்கவா?")) return; cart={}; customs={}; save(); closeSheet(); renderAll(); toast("பில் நீக்கப்பட்டது"); return; }
  if(t.id==="newBill"){ closeSheet(); renderAll(true); return; }
  if(t.id==="copySum") return copyText($("#sum").textContent);
  if(d.bwa!==undefined){ const b=billCache[+d.bwa]; if(b) window.open(waUrl(b.phone||"",billText(b)),"_blank","noopener"); return; }
  if(d.bcopy!==undefined){ const b=billCache[+d.bcopy]; if(b) copyText(billText(b)); return; }
  if(t.hasAttribute("data-close")) closeSheet();
});
$("#veil").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.ri!==undefined){ e.preventDefault(); saveItemEdit(); }
});
$("#q").addEventListener("input",renderView);
document.addEventListener("input",e=>{
  const f=e.target.closest&&e.target.closest(".fld"); if(f) f.classList.remove("bad");
  const id=e.target.id;
  if(id==="cRate") updateCustomTotal();
  if(id==="gTa"||id==="gEn") groupPreview();
  if(id==="iSizes"){ keepIVals(); renderIRows(); }
  if(e.target.dataset && e.target.dataset.iri!==undefined && iForm) iForm.vals[e.target.dataset.isz]=e.target.value;
  if(e.target.dataset && e.target.dataset.ri!==undefined) itemHint(Number(e.target.dataset.ri));
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="cPerm") togglePerm();
  if(id==="cCat"){ if(e.target.value==="__new"){ const d={name:$("#cName").value,size:$("#cSize").value,rate:$("#cRate").value,qty:customQty}; openGroupForm(null,{type:"custom",from:customFrom,draft:d}); } else customCat=e.target.value; }
  if(id==="iCat"){ if(e.target.value==="__new"){ const d=itemDraft(); d.cat=iForm.cat; openGroupForm(null,{type:"item",draft:d}); } else iForm.cat=e.target.value; }
  if(id==="uComp" && e.target.value==="__new"){ const d=userDraft(); d.companyId=""; openCompanyForm(null,{type:"user",draft:d}); }
});
window.addEventListener("hashchange",()=>{ $("#q").value=""; renderAll(true); if(view()==="admin") loadAdmin(); });

/* ================= START ================= */
(async function start(){
  $("#lBis").textContent=BISMILLAH;
  $("#lApp").innerHTML=esc(APP_NAME).replace(/^(\S+)/,"<span>$1</span>");
  $("#lAppTa").textContent=APP_NAME_TA;
  renderBrand();
  if(location.protocol==="file:"){ showLogin("இந்த app server-ல் (Tomcat) மட்டுமே இயங்கும். WAR-ஐ deploy செய்து http://server:8080/... வழியாக திறக்கவும்"); return; }
  if(!token){ showLogin(); return; }
  busy(true);
  try{ await enter(await api("me")); }
  catch(e){ if(e.status===401||e.status===403) setToken(null); showLogin(e.status===401?"":e.message); }
  finally{ busy(false); }
})();
</script>
