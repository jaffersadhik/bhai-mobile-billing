  if(t.id==="cfbSave"){ cfbSave(); return; }
  if(t.id==="cfbBack"){ openCancelFromBill(cfb.phone); return; }
  if(t.id==="cfbAgain"){ openCancelFromBill(cfb.phone); return; }
  if(t.id==="saveCancelBill"){ saveCancelBill(); return; }
  if(t.id==="backToBill"){ openBill(); return; }
  if(d.cxr){ $("#cxReason").value=d.cxr; $("#fCxReason").classList.remove("bad"); return; }
  if(t.id==="mCancels"){ openCancels(); return; }
  if(d.cxwa!==undefined){ const b=cancelCache[+d.cxwa]; if(b) window.open(waUrl(b.phone||"",cancelText(b)),"_blank","noopener"); return; }
  if(d.cxcopy!==undefined){ const b=cancelCache[+d.cxcopy]; if(b) copyText(cancelText(b)); return; }
  if(d.bcopy!==undefined){ const b=billCache[+d.bcopy]; if(b) copyText(billText(b)); return; }
  if(t.hasAttribute("data-close")) closeSheet();
});
$("#veil").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#scan").classList.contains("on")) closeScanner(); else closeSheet(); }
  if(e.key==="Enter" && e.target.id==="pendQ"){ const qd=e.target.value.replace(/\D/g,""); if(/^[6-9]\d{9}$/.test(qd)){ e.preventDefault(); const g=pendAll&&pendAll.pending.find(x=>x.phone===qd); closeSheet(); setTimeout(()=>openBill({phone:qd,customer:g?g.customer:""}),50); } return; }
  if(e.key==="Enter" && e.target.id==="scCode"){ e.preventDefault(); const c=e.target.value; e.target.value=""; gotScan(c,true); return; }
  if(e.key==="Enter" && e.target.id==="cfbPhone"){ e.preventDefault(); cfbFind(); return; }
  if(e.key==="Enter" && e.target.id==="q"){ const c=cleanCode(e.target.value); if(c.length>=3 && byCode[c]){ e.preventDefault(); e.target.value=""; renderView(); scanToCart(c); } return; }
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.ri!==undefined){ e.preventDefault(); saveItemEdit(); }
});
$("#q").addEventListener("input",renderView);
document.addEventListener("input",e=>{
  const f=e.target.closest&&e.target.closest(".fld"); if(f) f.classList.remove("bad");
  if(e.target.classList && (e.target.classList.contains("bci")||e.target.id==="cCode")){ const c=cleanCode(e.target.value); if(c!==e.target.value) e.target.value=c; }
  const id=e.target.id;
  if(id==="cRate") updateCustomTotal();
  if(id==="pendQ") renderPendGroups();
  if(id==="poQ") poSuggest();
  if(e.target.dataset && e.target.dataset.pol!==undefined && poForm){ poForm.lines[Number(e.target.dataset.pol)][e.target.dataset.f]=e.target.value; poTotals(); }
  if((id==="poOther"||id==="poDisc"||id==="poPaid") && poForm) poTotals();
  if(id==="uFilterQ") renderUserList();
  if(id==="iPhone") checkPending();
  if(id==="trQ") renderTrSug();
  if(id==="lbq") lbRenderList();
  if(id==="invMonth"&&e.target.value){ invMonth=e.target.value; invData=null; loadInv(); }
  if(id==="invCoSel"){ invCo=e.target.value; invData=null; loadInv(); }
  if(e.target.dataset && e.target.dataset.lbk!==undefined){ const k=e.target.dataset.lbk, v=parseInt(e.target.value,10); if(v>0) lb.q[k]=Math.min(v,999); else delete lb.q[k]; lbTotal();
    const el=document.querySelector(`[data-lbitem="${CSS.escape(k.split("|")[0])}"]`); if(el) el.outerHTML=lbCard(byId[k.split("|")[0]]); }
  if(e.target.id==="lbFmtSel"){ lb.fmt=e.target.value; lbSave(); lbPreview(); }
  if(id==="stVal") stPreview();
  if(id==="srq"){ const pos=e.target.selectionStart; renderView(); const n=$("#srq"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } }
  if(id==="stq"){ const pos=e.target.selectionStart; renderView(); const n=$("#stq"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } }
  if(id==="gTa"||id==="gEn") groupPreview();
  if(id==="iSizes"){ keepIVals(); renderIRows(); }
  if(e.target.dataset && e.target.dataset.iri!==undefined && iForm) iForm.vals[e.target.dataset.isz]=e.target.value;
  if(e.target.dataset && e.target.dataset.ri!==undefined){ itemHint(Number(e.target.dataset.ri)); editCostHint(Number(e.target.dataset.ri)); }
  if(e.target.dataset && e.target.dataset.eci!==undefined){ e.target.style.borderColor=""; editCostHint(Number(e.target.dataset.eci)); }
  if(e.target.dataset && e.target.dataset.cri!==undefined){ e.target.style.borderColor=""; newCostHint(Number(e.target.dataset.cri)); }
  if(e.target.dataset && e.target.dataset.iri!==undefined) newCostHint(Number(e.target.dataset.iri));
});
document.addEventListener("change",e=>{
  if(e.target.id==="phFile"&&e.target.files&&e.target.files[0]){ uploadPhoto(e.target.files[0]); e.target.value=""; return; }
  const id=e.target.id;
  if(id==="cPerm") togglePerm();
  if(id==="lkItem") lkSizes();
  if(id==="lkSize") lkWarn();
  if(id==="cCat"){ if(e.target.value==="__new"){ const d={name:$("#cName").value,size:$("#cSize").value,rate:$("#cRate").value,code:$("#cCode").value,qty:customQty}; openGroupForm(null,{type:"custom",from:customFrom,draft:d}); } else customCat=e.target.value; }
  if(id==="iCat"){ if(e.target.value==="__new"){ const d=itemDraft(); d.cat=iForm.cat; openGroupForm(null,{type:"item",draft:d}); } else iForm.cat=e.target.value; }
  if(id==="rDate" && e.target.value) loadReport(e.target.value);
  if(id==="rBranch"){ repBranch=e.target.value; loadReport(repDate); }
  if(id==="poSupSel"){ poForm.supplierId=e.target.value; $("#poSupNew").hidden=e.target.value!=="__new"; supInfo(); }
  if(e.target.dataset && e.target.dataset.pol!==undefined && poForm && e.target.tagName==="SELECT"){ poForm.lines[Number(e.target.dataset.pol)].gstPct=Number(e.target.value); poTotals(); }
  if(id==="poBranch"){ poBr=e.target.value; poData=null; loadPoList(); }
  if(id==="uFilterCo"){ uFilterCo=e.target.value; try{ localStorage.setItem("bmb_ufilter",uFilterCo); }catch(x){} renderUserList(); }
  if(id==="srBranch"){ srBranch=e.target.value; srData=null; loadStockRep(); }
  if(id==="stBranch"){ stockBr=e.target.value; stockData=null; loadStock(); }
  if(id==="uComp" && e.target.value!=="__new") fillUBranches();
  if(id==="uComp" && e.target.value==="__new"){ const d=userDraft(); d.companyId=""; openCompanyForm(null,{type:"user",draft:d}); }
});
window.addEventListener("hashchange",()=>{ $("#q").value=""; renderAll(true); if(view()==="admin") loadAdmin(); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="stVal"){ e.preventDefault(); saveStockEdit(); } });

(async function start(){
  $("#lBis").textContent=BISMILLAH;
  $("#lApp").innerHTML=esc(APP_NAME).replace(/^(\S+)/,"<span>$1</span>");
  $("#lAppTa").textContent=APP_NAME_TA;
  renderBrand();
  if(location.protocol==="file:"){ showLogin("இந்த app server-ல் (Tomcat) மட்டுமே இயங்கும். WAR-ஐ deploy செய்து http://server:8080/... வழியாக திறக்கவும்"); return; }
  if(!token){ showLogin(); return; }
  busy(true);
  try{ await enter(await api("me")); }
  catch(e){ if(e.status===401||e.status===403) setToken(null); showLogin(e.status===401?"":e.message); }
  finally{ busy(false); }
})();
