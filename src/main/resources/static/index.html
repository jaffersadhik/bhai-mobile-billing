}

function trendSvg(r){
  const pts=r.trend||[]; if(!pts.length) return "";
  const W=440,H=150,pl=34,pb=18,pt=8, cw=(W-pl-4)/pts.length, bw=Math.max(3,cw*.7);
  const max=Math.max(1,...pts.map(p=>p.total)), sc=v=>(H-pb-pt)*v/max;
  const ticks=[0,.5,1].map(f=>max*f);
  const avg=r.monthSales.perDay||0;
  let g=ticks.map(v=>`<text x="${pl-4}" y="${H-pb-sc(v)+3}" text-anchor="end">${v>=1000?Math.round(v/1000)+"k":Math.round(v)}</text><line x1="${pl}" x2="${W}" y1="${H-pb-sc(v)}" y2="${H-pb-sc(v)}" stroke="#eef2ef"/>`).join("");
  g+=pts.map((p,i)=>{ const x=pl+i*cw+(cw-bw)/2, h=Math.max(p.total>0?2:1.5,sc(p.total)), dn=Number(p.d.slice(8));
    const cls=p.d===r.date?"bar sel":(p.total>0?"bar":"bar zero");
    return `<rect class="${cls}" data-rday="${p.d}" x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${dShort(p.d)}: ${inr0(p.total)} · ${p.count} பில்</title></rect>`
      +((dn===1||dn%5===0||p.d===r.date)?`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle"${p.d===r.date?' style="fill:var(--leaf-d);font-weight:800"':""}>${dn}</text>`:"");
  }).join("");
  if(avg>0) g+=`<line class="avg" x1="${pl}" x2="${W}" y1="${(H-pb-sc(avg)).toFixed(1)}" y2="${(H-pb-sc(avg)).toFixed(1)}"/>`;
  return `<svg class="rp-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales chart">${g}</svg>`;
}

function hbars(list,valKey,fmt,labelFn){
  if(!list||!list.length) return `<p class="hint" style="margin:4px 0">தரவு இல்லை</p>`;
  const max=Math.max(1,...list.map(x=>x[valKey]));
  return `<div class="rp-hb">${list.map(x=>`<span class="k">${labelFn(x)}</span><span class="t"><i style="width:${Math.max(2,x[valKey]*100/max).toFixed(1)}%"></i></span><span class="n">${fmt(x)}</span>`).join("")}</div>`;
}

function branchSalesHtml(r){

  L.push(`*${company.name}*`, `📊 விற்பனை அறிக்கை${r.scope&&r.scope.branchName?" · 🏬 "+r.scope.branchName:""}`, ``);
  L.push(`*இன்று (${dLabel(r.today)})*`, `விற்பனை: ${inr(T.total)}`, `பில்கள்: ${T.count} · பீஸ்: ${T.pieces}`);
  if(r.date!==r.today) L.push(``, `*${dLabel(r.date)}*`, `விற்பனை: ${inr(D.total)}`, `பில்கள்: ${D.count} · பீஸ்: ${D.pieces}`);
  L.push(``, `*${mLabel(r.month)}*`, `மொத்தம்: ${inr(M.total)}`, `பில்கள்: ${M.count} · நாள் சராசரி: ${inr0(M.perDay)}`);
  if(M.growth!=null) L.push(`கடந்த மாதத்துடன்: ${M.growth>=0?"▲":"▼"} ${Math.abs(M.growth)}%`);
  if(r.bestDay) L.push(`சிறந்த நாள்: ${dShort(r.bestDay.d)} (${inr0(r.bestDay.total)})`);
  if(r.branchSales&&r.branchSales.length>1){ L.push(``, `*கிளை வாரியாக (${mLabel(r.month)})*`); r.branchSales.forEach(b=>L.push(`${b.name}: ${inr0(b.monthTotal)} (${b.monthCount} பில்) · இன்று ${inr0(b.dayTotal)}`)); }
  if(r.userSales&&r.userSales.length){ L.push(``, `*User வாரியாக (${mLabel(r.month)})*`); r.userSales.forEach(u=>L.push(`${u.name}: ${u.monthCount} பில் · ${inr0(u.monthTotal)}`)); }
  if(r.topItemsMonth&&r.topItemsMonth.length){ L.push(``, `*அதிகம் விற்றவை*`); r.topItemsMonth.slice(0,5).forEach((x,i)=>L.push(`${i+1}. ${x.name} — ${x.qty} pcs · ${inr0(x.amt)}`)); }
  L.push(``, `— ${APP_NAME}`);
  return L.join("\n");
}

  if(t.id==="ucRescan"){ const pc=pendingCode; closeSheet(); if(pc&&pc.back==="bill"){ openBill(); } return startCartScan(); }
  if(t.id==="ucCancel"){ const pc=pendingCode; pendingCode=null; if(pc&&pc.back==="bill"&&pieces()>0) openBill(); else closeSheet(); return; }

  if(t.id==="lkBack"){ const pc=pendingCode; if(pc) openUnknownCode(pc.code,pc.back); return; }

  if(d.stedit) return openStockEdit(d.stedit,d.stsize);

  if(t.id==="stScan") return stockScan();

    $("#stVal").value=d.stmode==="set"?stQty(stockEdit.id,stockEdit.size):0;
    $("#stHint").textContent=d.stmode==="set"?"புதிய மொத்த ஸ்டாக் எண்ணை உள்ளிடவும் (மைனஸ் அனுமதி)":"வந்த பீஸ் + / விற்ற அல்லது சேதம் − (எ.கா. 10 அல்லது -2)"; stPreview(); return; }
  if(t.id==="stSign"){ const v=stNum(); $("#stVal").value=isFinite(v)?-v:"-"; stPreview(); return; }
  if(d.stq){ const v=stNum(); $("#stVal").value=(isFinite(v)?v:0)+Number(d.stq); stPreview(); return; }
  if(t.id==="stSave") return saveStockEdit();
  if(d.branches) return openBranches(d.branches);
  if(t.id==="brAdd"){ const n=$("#brNew").value.trim(); if(!n){ $("#fBrNew").classList.add("bad"); return; } return branchApi(()=>api("admin/branch","POST",{companyId:brCo,name:n}),"கிளை சேர்க்கப்பட்டது: "+n); }
  if(d.brsave){ const n=$("#brn_"+CSS.escape(d.brsave)).value.trim(); if(!n){ toast("பெயர் தேவை"); return; } return branchApi(()=>api("admin/branch","POST",{companyId:brCo,id:d.brsave,name:n}),"சேமிக்கப்பட்டது: "+n); }
  if(d.brdel){ if(!confirm("இந்த கிளையை நீக்கவா?")) return; return branchApi(()=>api("admin/branch/"+encodeURIComponent(brCo)+"/"+encodeURIComponent(d.brdel),"DELETE"),"கிளை நீக்கப்பட்டது"); }
  if(t.id==="openReport"||t.id==="mReport"){ closeSheet(); if(location.hash!=="#report") location.hash="report"; else loadReport(repDate); return; }
  /* report */
  if(d.rnav){ const dt=new Date(repDate+"T00:00:00"); dt.setDate(dt.getDate()+Number(d.rnav)); return loadReport(ymd(dt)); }
  if(t.id==="rToday") return loadReport(null);
  if(d.rtop){ repTop=d.rtop; renderView(); return; }
  if(d.rbill!==undefined){ const h=t.closest(".bh"); if(h) h.classList.toggle("open"); return; }
  if(t.id==="rShare"){ if(repData) window.open(waUrl("",reportText(repData)),"_blank","noopener"); return; }
  if(t.id==="rCopy"){ if(repData) copyText(reportText(repData)); return; }
  if(t.id==="rPrint"){ window.print(); return; }
  if(d.compreport) return openCompanyBilling(d.compreport,"report");
  if(t.id==="mCompany") return openCompanyInfo();
  if(t.id==="mEditCompany"){ (adminData?Promise.resolve():loadAdmin()).then(()=>openCompanyForm(company.id)); return; }
  if(t.id==="mAdmin"){ closeSheet(); if(location.hash!=="#admin") location.hash="admin"; else loadAdmin(); return; }
  if(t.id==="mPw"||t.id==="chgPw") return openPw();
  if(t.id==="pwSave") return savePw();
  if(t.id==="mLogout") return logout();
  if(t.id==="toHome"){ location.hash=""; return; }
  /* admin */
  if(t.id==="addCompany") return openCompanyForm(null);
  if(d.editcomp) return openCompanyForm(d.editcomp);
  if(d.opencomp) return openCompanyBilling(d.opencomp);
  if(d.adduserfor){ openUserForm(null,{type:"sales",companyId:d.adduserfor}); return; }
  if(t.id==="addUser") return openUserForm(null);
  if(d.edituser) return openUserForm(d.edituser);
  if(d.deluser) return deleteUser(d.deluser);
  if(d.utype){ uForm.type=d.utype; syncUType(); return; }
  if(t.id==="uGen"){ const a="abcdefghjkmnpqrstuvwxyz23456789"; let p=""; const r=new Uint32Array(8); crypto.getRandomValues(r); r.forEach(x=>p+=a[x%a.length]); $("#uPass").value=p; $("#fuPass").classList.remove("bad"); return; }
  if(t.id==="userSave") return saveUser();
  if(t.id==="userCancel"){ uForm=null; closeSheet(); return; }
  if(t.id==="compSave") return saveCompany();
  if(t.id==="compDel") return deleteCompany();
  if(t.id==="compCancel"){ const r=kForm&&kForm.ret; kForm=null; if(r&&r.type==="user"){ r.draft.companyId=""; openUserForm(r.draft.id,r.draft); } else closeSheet(); return; }
  if(t.id==="credCopy") return copyText($("#credTxt").textContent);
  /* setup */
  if(t.id==="setupSample") return setupCompany("sample");
  if(t.id==="setupEmpty") return setupCompany("empty");
  /* groups & items */
  if(t.id==="addGroup") return openGroupForm(null);
  if(d.editgroup) return openGroupForm(d.editgroup);
  if(d.additem) return openItemForm(d.additem);
  if(d.gemoji){ gForm.emoji=d.gemoji; document.querySelectorAll("[data-gemoji]").forEach(b=>b.classList.toggle("on",b===t)); groupPreview(); return; }
  if(d.gcolor){ gForm.color=d.gcolor; document.querySelectorAll("[data-gcolor]").forEach(b=>b.classList.toggle("on",b===t)); groupPreview(); return; }
  if(t.id==="groupSave") return saveGroup();
  if(t.id==="groupDel") return deleteGroup();
  if(t.id==="groupCancel"){ const r=gForm&&gForm.ret; gForm=null;
    if(r&&r.type==="item") openItemForm(r.draft.cat,r.draft); else if(r&&r.type==="custom") openCustom(r.from,"",{draft:r.draft}); else closeSheet(); return; }
  if(d.iset){ keepIVals(); iForm.set=d.iset; document.querySelectorAll("[data-iset]").forEach(b=>b.classList.toggle("on",b===t)); $("#fISizes").hidden=iForm.set!=="custom"; renderIRows(); if(iForm.set==="custom") $("#iSizes").focus(); return; }
  if(t.id==="itemFill"){ const b=numIn($("#iBase").value), st=numIn($("#iStep").value)||0;
    if(!isFinite(b)||b<=0){ toast("முதல் சைஸ் ரேட்டை உள்ளிடவும்"); $("#iBase").focus(); return; }
    document.querySelectorAll("[data-isz]").forEach((inp,i)=>{ inp.value=money(b+st*i); $("#if"+i).classList.remove("bad"); }); keepIVals(); return; }
  if(t.id==="itemSave") return saveItem();
  if(t.id==="itemCancel"){ iForm=null; closeSheet(); return; }

  if(t.id==="itemEditSave") return saveItemEdit();
  if(t.id==="itemDel") return deleteItem();

  if(d.bcopy!==undefined){ const b=billCache[+d.bcopy]; if(b) copyText(billText(b)); return; }
  if(t.hasAttribute("data-close")) closeSheet();
});

});
